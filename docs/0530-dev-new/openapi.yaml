openapi: 3.1.0
info:
  title: Bytedancehack Backend API
  version: 0.2.0-0530
  description: |
    0530 target backend contract derived from docs/0529-dev/product-api and
    docs/0529-dev/prompt-api.

    Design notes:
    - Prompt-facing provider text must be assembled in Chinese.
    - LLM providers may draft editable artifacts only. Approved artifacts are
      compiled deterministically for downstream provider calls.
    - All shot workflow routes are workspace-scoped; non-workspace-scoped
      shot routes are not part of the 0530 target contract.
    - Workspace is a logical record. Local directory and future S3 location are
      modeled as a one-to-one storage binding; downstream stages are blocked
      until the workspace has exactly one active storage binding.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: System
  - name: Workspace
  - name: Storage
  - name: Materials
  - name: Artifacts
  - name: Shots
  - name: Image Workflow
  - name: Video Workflow
  - name: Final Video
  - name: Trace

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/config/limits:
    get:
      tags: [System]
      summary: Get configured generation limits.
      operationId: getConfigLimits
      responses:
        "200":
          description: Batch size limits and supported aspect ratios.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigLimits"

  /api/workspaces:
    get:
      tags: [Workspace]
      summary: List managed workspaces.
      operationId: listWorkspaces
      responses:
        "200":
          description: Managed workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [workspaceRoot, workspaces]
                properties:
                  workspaceRoot:
                    type: string
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Workspace]
      summary: Create a logical workspace.
      description: Creates a workspace id and script context. The client may bind storage in this request or later through /api/workspaces/{workspaceId}/storage/bind. If no storage is bound, /api/workspaces/status returns nextAction=BIND_STORAGE and material/artifact/shot stages must not proceed.
      operationId: createWorkspace
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "200":
          description: Workspace and optional storage manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInitializeResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/storage:
    get:
      tags: [Storage]
      summary: Get workspace storage binding.
      description: Returns the active one-to-one storage binding for a workspace. A workspace can have only one active binding, and a localPath or S3 bucket+prefix can be bound to only one workspace.
      operationId: getWorkspaceStorage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace storage binding, or an unbound state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StorageBinding"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/storage/bind:
    post:
      tags: [Storage]
      summary: Bind local or S3 storage to a workspace.
      description: Binds exactly one storage backend to a workspace. The binding is idempotent only when the same workspace repeats the same storage target; otherwise an already-bound workspace returns WORKSPACE_STORAGE_ALREADY_BOUND, and a storage target already owned by another workspace returns STORAGE_ALREADY_BOUND.
      operationId: bindWorkspaceStorage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageBindRequest"
      responses:
        "200":
          description: Bound storage.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StorageBinding"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/status:
    post:
      tags: [Workspace]
      summary: Get workspace pipeline status.
      description: Status is the gatekeeper for downstream stages. If the workspace has no storage binding, the response must expose nextAction=BIND_STORAGE and clients must not upload materials or start artifact/shot workflows.
      operationId: getWorkspaceStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTargetRequest"
      responses:
        "200":
          description: Workspace status, materials, artifacts, and next action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatusResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/materials:
    post:
      tags: [Materials]
      summary: Upload a material into the workspace.
      description: Requires an active workspace storage binding. The backend writes into the bound storage target, then returns both the workspace material ref and the DB assetId so downstream shot_asset_refs and provider reference-image resolution use the same stable identifier.
      operationId: uploadWorkspaceMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadMaterialJsonRequest"
          multipart/form-data:
            schema:
              type: object
              required: [workspaceId, file]
              properties:
                workspaceId:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded material.
          content:
            application/json:
              schema:
                type: object
                required: [workspace, material]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  material:
                    $ref: "#/components/schemas/MaterialUploadResult"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/material-intake:
    post:
      tags: [Artifacts]
      summary: Propose material intake artifact.
      operationId: proposeMaterialIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  properties:
                    prompt:
                      type: string
                    selectedMaterialRefs:
                      type: array
                      items:
                        type: string
      responses:
        "200":
          description: Material intake artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/brief/propose:
    post:
      tags: [Artifacts]
      summary: Propose product brief artifact.
      operationId: proposeBrief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  properties:
                    userDirection:
                      type: string
                    title:
                      type: string
                    sellingPoints:
                      type: string
                    audience:
                      type: string
                    stylePreference:
                      type: string
      responses:
        "200":
          description: Product brief artifact draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/artifacts/brief/approve:
    post:
      tags: [Artifacts]
      summary: Approve product brief artifact.
      operationId: approveBrief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/ProductBriefArtifact"
      responses:
        "200":
          description: Approved brief artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/storyboard/propose:
    post:
      tags: [Artifacts]
      summary: Propose storyboard artifact.
      operationId: proposeStoryboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  properties:
                    userDirection:
                      type: string
      responses:
        "200":
          description: Storyboard artifact draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/artifacts/storyboard/approve:
    post:
      tags: [Artifacts]
      summary: Approve storyboard artifact.
      operationId: approveStoryboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/StoryboardArtifact"
      responses:
        "200":
          description: Approved storyboard artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/shotprompt/compile:
    post:
      tags: [Artifacts]
      summary: Compile approved storyboard into shot prompt artifact.
      description: Deterministically compiles the approved storyboard into a user-reviewable shot prompt artifact.
      operationId: compileShotPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  properties:
                    aspectRatio:
                      $ref: "#/components/schemas/AspectRatio"
                    userDirection:
                      type: string
      responses:
        "200":
          description: Shot prompt artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArtifactResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/artifacts/shotprompt/approve:
    post:
      tags: [Artifacts]
      summary: Approve shot prompt and seed storyboard shots.
      operationId: approveShotPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkspaceTargetRequest"
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/ShotPromptArtifact"
      responses:
        "200":
          description: Approved shot prompt and seeded shots.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots:
    get:
      tags: [Shots]
      summary: List shots for a workspace.
      operationId: listWorkspaceShots
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Ordered shots.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shot"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shot-workflow-status:
    get:
      tags: [Shots]
      summary: Get shot workflow status for all shots.
      operationId: getShotWorkflowStatus
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Shot status summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotWorkflowStatusResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-prompts/propose:
    post:
      tags: [Image Workflow]
      summary: Propose image prompt artifact for a shot.
      description: Backend hydrates approved brief, material intake, shotprompt shot, shot_asset_refs, previous prompt context, and scene anchor. The client may pass a userDirection, but must not provide arbitrary image_ref URLs.
      operationId: proposeShotImagePrompt
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userDirection:
                  type: string
                stylePresetId:
                  type: string
      responses:
        "200":
          description: Image prompt artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-rounds:
    get:
      tags: [Image Workflow]
      summary: List image prompt rounds and candidates for a shot.
      description: Aggregated view of one or more image prompt artifacts, their batches, candidates, current selection, and injected context summary.
      operationId: listShotImageRounds
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Image rounds.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRound"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-candidates/select:
    post:
      tags: [Image Workflow]
      summary: Select one image candidate as the shot key frame.
      description: The backend validates candidate ownership, active round, batch match, and SUCCEEDED status before UPSERT.
      operationId: selectShotImageCandidate
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId:
                  type: string
      responses:
        "200":
          description: Selected image state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSelectionResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-batches:
    post:
      tags: [Image Workflow]
      summary: Create image generation batch.
      operationId: createShotImageBatch
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imagePromptArtifactId]
              properties:
                imagePromptArtifactId:
                  type: string
                count:
                  type: integer
                  minimum: 1
                aspectRatio:
                  $ref: "#/components/schemas/AspectRatio"
      responses:
        "200":
          description: Created or deduped image batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-batches/{batchId}:
    get:
      tags: [Image Workflow]
      summary: Get image batch and candidates.
      operationId: getShotImageBatch
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Image batch.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/GenerationBatch"
                      - type: object
                        properties:
                          candidates:
                            type: array
                            items:
                              $ref: "#/components/schemas/ImageCandidate"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-scripts/propose:
    post:
      tags: [Video Workflow]
      summary: Propose video script artifact for a shot.
      description: All shots must be image-selected before video generation is unlocked. Backend injects firstFrameUrl from this shot's selected image and lastFrameUrl from the next shot's selected image; the last shot uses null lastFrameUrl.
      operationId: proposeShotVideoScript
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userDirection:
                  type: string
                durationSec:
                  type: integer
                  minimum: 1
                  maximum: 8
                useNeighborFrames:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Video script artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-rounds:
    get:
      tags: [Video Workflow]
      summary: List video script rounds and candidates for a shot.
      description: Aggregated view of video script artifacts, their batches, candidates, current selection, and first/last frame bindings.
      operationId: listShotVideoRounds
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Video rounds.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoRound"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-candidates/select:
    post:
      tags: [Video Workflow]
      summary: Select one video candidate for final composition.
      description: The backend validates candidate ownership, active round, batch match, and SUCCEEDED status before UPSERT.
      operationId: selectShotVideoCandidate
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId:
                  type: string
      responses:
        "200":
          description: Selected video state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoSelectionResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-batches:
    post:
      tags: [Video Workflow]
      summary: Create video generation batch.
      operationId: createShotVideoBatch
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoScriptArtifactId]
              properties:
                videoScriptArtifactId:
                  type: string
                count:
                  type: integer
                  minimum: 1
                aspectRatio:
                  $ref: "#/components/schemas/AspectRatio"
      responses:
        "200":
          description: Created or deduped video batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-batches/{batchId}:
    get:
      tags: [Video Workflow]
      summary: Get video batch and candidates.
      operationId: getShotVideoBatch
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Video batch.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/GenerationBatch"
                      - type: object
                        properties:
                          candidates:
                            type: array
                            items:
                              $ref: "#/components/schemas/VideoCandidate"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/final-videos:
    post:
      tags: [Final Video]
      summary: Create final video compose job.
      operationId: createFinalVideo
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outputAspectRatio:
                  $ref: "#/components/schemas/AspectRatio"
      responses:
        "200":
          description: Created or deduped final compose job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [finalVideoJobId, jobId, status]
                    properties:
                      finalVideoJobId:
                        type: string
                      jobId:
                        type: string
                      status:
                        $ref: "#/components/schemas/FinalVideoStatus"
                  deduped:
                    type: boolean
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [Final Video]
      summary: List final video jobs for a workspace.
      operationId: listFinalVideos
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Final video jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinalVideoJob"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/final-videos/{finalVideoJobId}:
    get:
      tags: [Final Video]
      summary: Get final video job.
      operationId: getWorkspaceFinalVideo
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/FinalVideoJobId"
      responses:
        "200":
          description: Final video job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FinalVideoJob"
        default:
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/final-videos/{finalVideoJobId}/file:
    get:
      tags: [Final Video]
      summary: Read completed final video file.
      operationId: getFinalVideoFile
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/FinalVideoJobId"
      responses:
        "200":
          description: MP4 file.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    ShotId:
      name: shotId
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
    FinalVideoJobId:
      name: finalVideoJobId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AspectRatio:
      type: string
      enum: ["9:16", "16:9", "1:1"]

    HealthResponse:
      type: object
      required: [ok, runtime]
      properties:
        ok:
          type: boolean
        runtime:
          type: string

    ConfigLimits:
      type: object
      required:
        - defaultImageBatchSize
        - maxImageBatchSize
        - defaultVideoBatchSize
        - maxVideoBatchSize
        - aspectRatios
      properties:
        defaultImageBatchSize:
          type: integer
        maxImageBatchSize:
          type: integer
        defaultVideoBatchSize:
          type: integer
        maxVideoBatchSize:
          type: integer
        aspectRatios:
          type: array
          items:
            $ref: "#/components/schemas/AspectRatio"

    ErrorResponse:
      type: object
      required: [message]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string

    WorkspaceTargetRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string

    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        storage:
          $ref: "#/components/schemas/StorageBindRequest"

    Workspace:
      type: object
      required: [id, currentScriptId, status, storage]
      properties:
        id:
          type: string
        storage:
          $ref: "#/components/schemas/StorageBinding"
        currentScriptId:
          type: string
        currentJobId:
          type: [string, "null"]
        status:
          type: string
        traceFile:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    WorkspaceManifest:
      type: object
      required: [schemaVersion, workspaceId, currentScriptId, traceFile, storage]
      properties:
        schemaVersion:
          type: integer
          const: 1
        workspaceId:
          type: string
        currentScriptId:
          type: string
        currentJobId:
          type: string
        traceFile:
          type: string
        storage:
          $ref: "#/components/schemas/StorageBinding"

    WorkspaceInitializeResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        manifest:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceManifest"
            - type: "null"
          description: Present after storage is bound; null when the logical workspace has not selected local/S3 storage yet.

    StorageBindRequest:
      oneOf:
        - $ref: "#/components/schemas/LocalStorageBindRequest"
        - $ref: "#/components/schemas/S3StorageBindRequest"

    LocalStorageBindRequest:
      type: object
      required: [kind, localPath]
      properties:
        kind:
          type: string
          const: local
        localPath:
          type: string
          description: Absolute local working directory. The normalized path can be bound to only one workspace.

    S3StorageBindRequest:
      type: object
      required: [kind, s3]
      properties:
        kind:
          type: string
          const: s3
        s3:
          $ref: "#/components/schemas/S3StorageLocator"

    S3StorageLocator:
      type: object
      required: [bucket, prefix]
      properties:
        bucket:
          type: string
        prefix:
          type: string
          description: Workspace root prefix within the bucket. The normalized bucket+prefix can be bound to only one workspace.
        region:
          type: [string, "null"]
        endpoint:
          type: [string, "null"]

    StorageBinding:
      type: object
      required: [workspaceId, bound, kind, status]
      properties:
        id:
          type: [string, "null"]
        workspaceId:
          type: string
        bound:
          type: boolean
        kind:
          type: [string, "null"]
          enum: [local, s3, null]
        localPath:
          type: [string, "null"]
          description: Present only when kind=local.
        s3:
          oneOf:
            - $ref: "#/components/schemas/S3StorageLocator"
            - type: "null"
        status:
          type: string
          enum: [UNBOUND, BOUND, UNAVAILABLE]
        traceRoot:
          type: [string, "null"]
          description: Stable trace root in the active storage target.
        createdAt:
          type: string
        updatedAt:
          type: string

    WorkspaceStatusResponse:
      type: object
      required: [workspaceId, storage, nextAction]
      additionalProperties: true
      properties:
        workspaceId:
          type: string
        storage:
          $ref: "#/components/schemas/StorageBinding"
        nextAction:
          type: string
          description: Includes BIND_STORAGE when storage.bound=false; otherwise advances through material/artifact/shot workflow states.
        canProceed:
          type: boolean
        blockedReason:
          type: [string, "null"]
        materialLibrary:
          type: array
          items:
            type: object
            additionalProperties: true

    UploadMaterialJsonRequest:
      type: object
      required: [workspaceId, filename, dataBase64]
      properties:
        workspaceId:
          type: string
        filename:
          type: string
          minLength: 1
          maxLength: 180
        dataBase64:
          type: string

    MaterialUploadResult:
      type: object
      required: [assetId, ref, bytes, url]
      properties:
        assetId:
          type: string
          description: DB asset id used by shot_asset_refs and provider reference-image resolution.
        ref:
          type: string
          description: Workspace material ref, usually the filename under .daireel/materials.
        bytes:
          type: integer
        mime:
          type: string
        sha256:
          type: string
        url:
          type: string
          description: Stable workspace URL for reading the uploaded material.

    WorkspaceArtifact:
      type: object
      required: [id, artifactType, status, data]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        scriptId:
          type: string
        artifactType:
          type: string
        status:
          type: string
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string

    WorkspaceArtifactResponse:
      type: object
      required: [artifact]
      properties:
        artifact:
          $ref: "#/components/schemas/WorkspaceArtifact"
        form:
          type: object
          additionalProperties: true
        traceId:
          type: string

    MaterialIntakeArtifact:
      type: object
      required: [primaryProductRef, assets, rejected]
      properties:
        scannedAt:
          type: string
        primaryProductRef:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/MaterialAsset"
        rejected:
          type: array
          items:
            type: object
            required: [ref, reason]
            properties:
              ref:
                type: string
              reason:
                type: string

    MaterialAsset:
      type: object
      required: [ref, kind, mime, role, description]
      properties:
        ref:
          type: string
        kind:
          type: string
          enum: [image, video, text]
        mime:
          type: string
        role:
          type: string
        description:
          type: string
        included:
          type: boolean
        usable:
          type: boolean
        sha256:
          type: string

    ProductBriefArtifact:
      type: object
      required: [product, audience, coreSellingPoint, proof, offer, brandTone]
      additionalProperties: true
      properties:
        product:
          type: object
          additionalProperties: true
        audience:
          type: object
          additionalProperties: true
        coreSellingPoint:
          type: string
        proof:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        offer:
          type: [string, "null"]
        brandTone:
          type: string

    StoryboardArtifact:
      type: object
      required: [narrative, totalDurationSec, shots, assumptions]
      properties:
        narrative:
          type: string
        totalDurationSec:
          type: integer
        shots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StoryboardShot"
        assumptions:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    StoryboardShot:
      type: object
      required: [index, purpose, durationSec, scene, visualDirection, productAssetRef, voiceover]
      properties:
        index:
          type: integer
          minimum: 0
        purpose:
          type: string
          enum: [hook, benefit, proof, cta]
        durationSec:
          type: integer
          minimum: 1
          maximum: 8
        scene:
          type: string
        visualDirection:
          type: string
        productAssetRef:
          type: string
        voiceover:
          type: string
        transition:
          type: string

    ShotPromptArtifact:
      type: object
      required: [targetProvider, durationSec, aspectRatio, prompt, negativePrompt, shots, tts]
      properties:
        targetProvider:
          type: string
          enum: [seedance]
        durationSec:
          type: integer
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        prompt:
          type: string
        negativePrompt:
          type: string
        shots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShotPromptShot"
        tts:
          type: object
          additionalProperties: true
        assumptions:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    ShotPromptShot:
      type: object
      required: [index, startSec, endSec, providerPrompt, referenceAssetRefs, voiceover]
      properties:
        index:
          type: integer
        startSec:
          type: integer
        endSec:
          type: integer
        providerPrompt:
          type: string
        referenceAssetRefs:
          type: array
          items:
            type: string
        voiceover:
          type: string

    ShotStatus:
      type: string
      enum:
        - DRAFT
        - IMAGE_PROMPT_PROPOSING
        - IMAGE_PROMPT_READY
        - IMAGE_PROMPT_EDITED
        - IMAGE_GENERATING
        - IMAGE_CANDIDATES_READY
        - IMAGE_SELECTED
        - VIDEO_SCRIPT_PROPOSING
        - VIDEO_SCRIPT_READY
        - VIDEO_SCRIPT_EDITED
        - VIDEO_GENERATING
        - VIDEO_CANDIDATES_READY
        - VIDEO_SELECTED
        - FAILED

    BatchStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED]

    CandidateStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, REJECTED]

    FinalVideoStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    Shot:
      type: object
      required: [id, workspaceId, orderIndex, title, status, nextAction]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        orderIndex:
          type: integer
        title:
          type: string
        objective:
          type: [string, "null"]
        defaultDurationSec:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/ShotStatus"
        nextAction:
          type: string
        activeImagePromptArtifactId:
          type: [string, "null"]
        selectedImageId:
          type: [string, "null"]
        activeVideoScriptArtifactId:
          type: [string, "null"]
        selectedVideoId:
          type: [string, "null"]
        referenceAssetRefs:
          type: array
          description: 0530 target field populated from shot_asset_refs seeded by approved shotprompt.
          items:
            type: string
        lastError:
          type: [string, "null"]

    ShotWorkflowStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workspaceId, shots, canComposeFinalVideo]
          properties:
            workspaceId:
              type: string
            canComposeFinalVideo:
              type: boolean
            shots:
              type: array
              items:
                type: object
                additionalProperties: true

    WorkflowEnvelope:
      type: object
      required: [data, shotStatus, nextAction]
      properties:
        data:
          type: object
          additionalProperties: true
        shotStatus:
          $ref: "#/components/schemas/ShotStatus"
        nextAction:
          type: string
        traceId:
          type: string
        warnings:
          type: array
          items:
            type: string
        context:
          $ref: "#/components/schemas/PromptContextSummary"

    BatchCreateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [batchId, jobId, status, requestedCount]
          properties:
            batchId:
              type: string
            jobId:
              type: string
            status:
              $ref: "#/components/schemas/BatchStatus"
            requestedCount:
              type: integer
        deduped:
          type: boolean

    GenerationBatch:
      type: object
      required: [id, status, requestedCount]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        shotId:
          type: string
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestedCount:
          type: integer
        succeededCount:
          type: integer
        failedCount:
          type: integer
        provider:
          type: string
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        errorMessage:
          type: [string, "null"]

    ImageCandidate:
      type: object
      required: [id, shotId, status, provider]
      properties:
        id:
          type: string
        batchId:
          type: string
        shotId:
          type: string
        imageUrl:
          type: [string, "null"]
          description: Stable workspace URL after provider 24h URL has been persisted.
        providerTemporaryUrl:
          type: [string, "null"]
          description: Debug-only provider URL when retained; clients should not depend on it.
        objectKey:
          type: [string, "null"]
          description: Stable storage object key or workspace-local key.
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        provider:
          type: string
        status:
          $ref: "#/components/schemas/CandidateStatus"
        errorMessage:
          type: [string, "null"]

    VideoCandidate:
      type: object
      required: [id, shotId, status, provider]
      properties:
        id:
          type: string
        batchId:
          type: string
        shotId:
          type: string
        videoUrl:
          type: [string, "null"]
          description: Stable workspace URL after provider 24h URL has been persisted.
        providerTemporaryUrl:
          type: [string, "null"]
          description: Debug-only provider URL when retained; clients should not depend on it.
        objectKey:
          type: [string, "null"]
          description: Stable storage object key or workspace-local key.
        thumbnailUrl:
          type: [string, "null"]
        durationSec:
          type: [integer, "null"]
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        provider:
          type: string
        status:
          $ref: "#/components/schemas/CandidateStatus"
        errorMessage:
          type: [string, "null"]

    ImageRound:
      type: object
      required: [artifact, candidates]
      properties:
        artifact:
          type: object
          additionalProperties: true
        batch:
          $ref: "#/components/schemas/GenerationBatch"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ImageCandidate"
        selection:
          $ref: "#/components/schemas/ImageSelectionResponse"
        context:
          $ref: "#/components/schemas/PromptContextSummary"

    VideoRound:
      type: object
      required: [artifact, candidates]
      properties:
        artifact:
          type: object
          additionalProperties: true
        batch:
          $ref: "#/components/schemas/GenerationBatch"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/VideoCandidate"
        selection:
          $ref: "#/components/schemas/VideoSelectionResponse"
        frames:
          $ref: "#/components/schemas/VideoFrameBinding"
        context:
          $ref: "#/components/schemas/PromptContextSummary"

    ImageSelectionResponse:
      type: object
      required: [shotId, selectedCandidateId, selectedImageUrl, nextShotId, allShotsImageSelected]
      properties:
        shotId:
          type: string
        selectedCandidateId:
          type: string
        selectedImageUrl:
          type: string
        nextShotId:
          type: [string, "null"]
        allShotsImageSelected:
          type: boolean

    VideoSelectionResponse:
      type: object
      required: [shotId, selectedCandidateId, selectedVideoUrl, duration, allShotsVideoSelected]
      properties:
        shotId:
          type: string
        selectedCandidateId:
          type: string
        selectedVideoUrl:
          type: string
        duration:
          type: integer
        allShotsVideoSelected:
          type: boolean

    PromptContextSummary:
      type: object
      description: Debug/review summary of backend-injected context used for prompt generation.
      properties:
        approvedBriefArtifactId:
          type: [string, "null"]
        materialIntakeArtifactId:
          type: [string, "null"]
        shotPromptArtifactId:
          type: [string, "null"]
        referenceAssetRefs:
          type: array
          items:
            type: string
        sceneAnchorImageUrl:
          type: [string, "null"]
        previousPromptArtifactId:
          type: [string, "null"]

    VideoFrameBinding:
      type: object
      required: [firstFrameUrl, lastFrameUrl]
      properties:
        firstFrameUrl:
          type: string
          description: Stable URL from selected_shot_images for the current shot.
        lastFrameUrl:
          type: [string, "null"]
          description: Stable URL from the next shot's selected_shot_images; null for the last shot.
        firstFrameCandidateId:
          type: string
        lastFrameCandidateId:
          type: [string, "null"]

    FinalVideoJob:
      type: object
      required: [id, workspaceId, status]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        status:
          $ref: "#/components/schemas/FinalVideoStatus"
        objectKey:
          type: [string, "null"]
          description: Stable storage object key in the active workspace storage binding.
        videoUrl:
          type: [string, "null"]
          description: Stable workspace URL for preview/download when the final video is ready.
        durationSec:
          type: [integer, "null"]
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        errorMessage:
          type: [string, "null"]
