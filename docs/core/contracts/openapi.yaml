openapi: 3.1.0
info:
  title: ecommerce-aigc-video API
  version: 2.0.0
  description: >
    V3 目标后端契约。全部路由前缀 /api，URL 无版本号，全站无鉴权。
    工作区级 agent 模块采用 propose -> approve 语义：propose 只生成待审 artifact，
    approve 才变为当前生效 artifact；下游只读取 approved/current。
    approve 不级联重置下游，shotprompt approve 也不重建 shots。
    新的分镜链路由显式创建 shot set 触发。上游变更通过 upstreamChanged 提示表达，
    不代表 stale，也不删除候选或选择。图像/视频选择写入 image_select_artifacts /
    video_select_artifacts，每个 shot 只有一个当前 selected image/video，重复选择用 UPSERT 覆盖。
    契约源见 docs/core/contracts/openapi.yaml 与 docs/core/contracts/interface.md。
    架构源见 docs/core/architecture/* 与 docs/core/product/*；docs/core/archived/*
    仅为迁移暂存，不作为新实现依赖。
servers:
  - url: http://localhost:3000
    description: 本地开发（SERVER_PORT 默认 3000）
tags:
  - name: Platform
  - name: SetupTemplate
  - name: Material
  - name: Workspace
  - name: ModuleArtifacts
  - name: ShotSet
  - name: Shot
  - name: Generation
  - name: Dashboard
  - name: Campaign
  - name: Trace

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string }
    ShotId:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    FinalVideoJobId:
      name: finalVideoJobId
      in: path
      required: true
      schema: { type: string }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string }
    DashboardVideoArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    Wildcard:
      name: wildcard
      in: path
      required: true
      description: Fastify 通配子路径。
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    Error:
      description: 业务错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleArtifactEnvelope:
      description: 模块 artifact 响应。
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/ModuleArtifact"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}

    AspectRatio:
      type: string
      enum: ["9:16", "16:9", "1:1"]
      default: "9:16"

    ArtifactStatus:
      type: string
      enum: [proposed, approved, archived, failed]

    BatchStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED]

    CandidateStatus:
      type: string
      enum: [PENDING, RUNNING, PERSISTING, SUCCEEDED, FAILED, REJECTED]

    ShotStatus:
      type: string
      enum:
        - DRAFT
        - IMAGE_PROMPT_PROPOSING
        - IMAGE_PROMPT_READY
        - IMAGE_GENERATING
        - IMAGE_CANDIDATES_READY
        - IMAGE_SELECTED
        - VIDEO_SCRIPT_PROPOSING
        - VIDEO_SCRIPT_READY
        - VIDEO_GENERATING
        - VIDEO_CANDIDATES_READY
        - VIDEO_SELECTED
        - FAILED

    UpstreamChange:
      type: object
      required: [upstreamChanged, changedSources]
      properties:
        upstreamChanged: { type: boolean }
        changedSources:
          type: array
          items: { type: string }
        message: { type: string }

    SourceFingerprint:
      type: object
      additionalProperties: true
      description: 生成本产物时读取的上游 artifact id/hash。
      properties:
        promptRequirementsArtifactId: { type: string }
        materialIntakeArtifactId: { type: string }
        productBriefArtifactId: { type: string }
        storyboardArtifactId: { type: string }
        baseStoryboardArtifactId:
          {
            type: string,
            nullable: true,
            description: storyboard 局部重写所基于的原 artifact。
          }
        rewriteKind: { type: string, description: 局部重写类型，例如 voiceover。 }
        shotPromptArtifactId: { type: string }
        shotSetId: { type: string }

    PromptAssemblyMetadata:
      type: object
      additionalProperties: true
      description: >
        Prompt 组装元数据。workspace module artifact 记录 subject/contract 模板 id
        与 hash；逐 shot image/video artifact 由后端确定性 assembler 装配，通常只
        记录 moduleId、assemblerVersion、source、mode。
      required: [moduleId, assemblerVersion]
      properties:
        moduleId:
          type: string
          enum:
            [
              prompt-requirements,
              material-intake,
              product-brief,
              storyboard,
              shotprompt,
              image-prompt,
              video-script
            ]
        source:
          {
            type: string,
            enum: [server-deterministic-assembler],
            description: 逐 shot 确定性装配来源；workspace module artifact 可为空。
          }
        mode:
          {
            type: string,
            enum: [propose, user-feedback-regenerate],
            description: 逐 shot 装配模式；workspace module artifact 可为空。
          }
        subjectTemplateId:
          {
            type: string,
            description: 主体创作 prompt 模板，例如 shotprompt/subject.md。
          }
        contractTemplateId:
          { type: string, description: 输入 artifact 与输出 schema 契约模板。 }
        subjectHash: { type: string, description: subject.md 内容 SHA-256。 }
        contractHash: { type: string, description: contract.md 内容 SHA-256。 }
        assemblerVersion:
          {
            type: string,
            description: workspace module 当前为 v2；逐 shot 使用对应 assembler 常量版本。
          }
        requirementArtifactId: { type: string }
        provider: { type: string }
        model: { type: string }
        preview:
          { type: string, description: 短 preview；完整 assembled prompt 写 trace。 }

    ModuleArtifact:
      type: object
      required: [id, workspaceId, moduleId, status, isCurrent, data, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        moduleId:
          type: string
          enum:
            [prompt-requirements, material-intake, product-brief, storyboard, shotprompt]
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        isCurrent: { type: boolean }
        data: {}
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }

    ModuleState:
      type: object
      required: [moduleId]
      properties:
        moduleId: { type: string }
        proposed:
          anyOf:
            - $ref: "#/components/schemas/ModuleArtifact"
            - type: "null"
        current:
          anyOf:
            - $ref: "#/components/schemas/ModuleArtifact"
            - type: "null"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"

    PromptRequirementData:
      type: object
      additionalProperties: true
      properties:
        image: { type: object, additionalProperties: true }
        script: { type: object, additionalProperties: true }
        storyboard: { type: object, additionalProperties: true }
        shotImage: { type: object, additionalProperties: true }
        shotVideo: { type: object, additionalProperties: true }
        creativeFactors:
          $ref: "#/components/schemas/CreativeFactors"
        factorGuidance:
          type: object
          additionalProperties: true
          description: 三个看板主因子展开后的 9 个可编辑细分字段。
        scriptInfluence:
          type: object
          additionalProperties: true
          description: 三个看板主因子对剧本生成的结构化影响缓存。
        compiledRequirementSourceMap:
          $ref: "#/components/schemas/CompiledRequirementSourceMap"
        creativeRequirementTemplate:
          $ref: "#/components/schemas/CreativeRequirementTemplateSource"

    ProductType:
      type: string
      enum:
        - consumable-good
        - durable-good
        - digital-service
        - offline-experience-service

    Audience:
      type: string
      enum: [general, toddler, child, youth, senior]

    Strategy:
      type: string
      enum:
        - pain-solution
        - scenario-demo
        - review-comparison
        - tutorial-value
        - authority-proof
        - emotional-story
        - curiosity-hook
        - visual-story

    VisualStyle:
      type: string
      enum: [authentic, cinematic]
      default: authentic

    CreativeFactors:
      type: object
      additionalProperties: false
      required: [productType, audience, strategy]
      properties:
        productType:
          $ref: "#/components/schemas/ProductType"
        audience:
          $ref: "#/components/schemas/Audience"
        strategy:
          $ref: "#/components/schemas/Strategy"
        visualStyle:
          $ref: "#/components/schemas/VisualStyle"
          description: Additive visual style control. Defaults to authentic when omitted.

    CompiledRequirementField:
      type: string
      enum:
        - image.style
        - image.composition
        - image.avoid
        - script.tone
        - storyboard.rhythm
        - shotImage.global
        - shotVideo.global

    CompiledRequirementSource:
      type: object
      additionalProperties: false
      required: [sourcePath, label, factor, affects]
      properties:
        sourcePath: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        factor:
          type: string
          enum: [productType, audience, strategy, scriptInfluence]
        affects:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CompiledRequirementField"

    CompiledRequirementSourceMap:
      type: object
      additionalProperties: false
      required:
        [
          imageStyle,
          imageComposition,
          imageAvoid,
          scriptTone,
          storyboardRhythm,
          shotImageGlobal,
          shotVideoGlobal
        ]
      properties:
        imageStyle:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        imageComposition:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        imageAvoid:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        scriptTone:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        storyboardRhythm:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        shotImageGlobal:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }
        shotVideoGlobal:
          {
            type: array,
            items: { $ref: "#/components/schemas/CompiledRequirementSource" }
          }

    CreativeRequirementTemplateSource:
      type: object
      additionalProperties: false
      required: [source, templateId, templateNameSnapshot, templateVersion, status]
      properties:
        source: { type: string, const: setup-template }
        templateId: { type: string, minLength: 1 }
        templateNameSnapshot: { type: string, minLength: 1 }
        templateVersion: { type: string, minLength: 1 }
        status:
          type: string
          enum: [applied, customized, detached]

    CreativeRequirementTemplateValues:
      type: object
      additionalProperties: false
      required:
        [
          imageStyle,
          imageComposition,
          imageAvoid,
          scriptTone,
          storyboardRhythm,
          shotImageGlobal,
          shotVideoGlobal
        ]
      properties:
        imageStyle: { type: string, minLength: 1 }
        imageComposition: { type: string, minLength: 1 }
        imageAvoid: { type: string, minLength: 1 }
        scriptTone: { type: string, minLength: 1 }
        storyboardRhythm: { type: string, minLength: 1 }
        shotImageGlobal: { type: string, minLength: 1 }
        shotVideoGlobal: { type: string, minLength: 1 }

    CreativeRequirementTemplateField:
      type: object
      additionalProperties: false
      required: [label, value, affects]
      properties:
        label: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        affects:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CompiledRequirementField"

    CreativeRequirementTemplateFields:
      type: object
      additionalProperties: false
      description: >-
        Key 为 factorGuidance.* 细分字段路径；每个字段声明它会影响 7 项编译创作要求中的哪些字段。
      required:
        - factorGuidance.productType.subjectPresentation
        - factorGuidance.productType.sceneAndDelivery
        - factorGuidance.productType.authenticityBoundaries
        - factorGuidance.audience.addressingAndTone
        - factorGuidance.audience.benefitFrame
        - factorGuidance.audience.sensitivityBoundaries
        - factorGuidance.strategy.openingHook
        - factorGuidance.strategy.storyStructure
        - factorGuidance.strategy.evidenceAndCta
      properties:
        factorGuidance.productType.subjectPresentation:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.productType.sceneAndDelivery:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.productType.authenticityBoundaries:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.audience.addressingAndTone:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.audience.benefitFrame:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.audience.sensitivityBoundaries:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.strategy.openingHook:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.strategy.storyStructure:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"
        factorGuidance.strategy.evidenceAndCta:
          $ref: "#/components/schemas/CreativeRequirementTemplateField"

    CreativeRequirementTemplate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          summary,
          version,
          productType,
          audiences,
          strategy,
          creativeFactors,
          fields,
          values
        ]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        productType:
          allOf:
            - $ref: "#/components/schemas/ProductType"
          description: 兼容旧调用方的平铺字段；新调用方以 creativeFactors.productType 为准。
        audiences:
          type: array
          minItems: 1
          description: 兼容旧调用方的平铺字段；P0 内置模板只包含 creativeFactors.audience。
          items:
            $ref: "#/components/schemas/Audience"
        strategy:
          allOf:
            - $ref: "#/components/schemas/Strategy"
          description: 兼容旧调用方的平铺字段；新调用方以 creativeFactors.strategy 为准。
        creativeFactors:
          $ref: "#/components/schemas/CreativeFactors"
        fields:
          $ref: "#/components/schemas/CreativeRequirementTemplateFields"
        values:
          $ref: "#/components/schemas/CreativeRequirementTemplateValues"

    CreativeRequirementTemplatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [templates]
          properties:
            templates:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/CreativeRequirementTemplate"

    ReferenceVideoImportRequest:
      type: object
      required: [source]
      properties:
        source:
          type: object
          required: [type, url]
          properties:
            type: { type: string, enum: [url] }
            url:
              type: string
              description: 可直接下载的视频 URL；平台落地页/HTML 不支持。

    ReferenceVideoImportSource:
      oneOf:
        - type: object
          required: [type, url, downloaded, contentType, sizeBytes]
          properties:
            type: { type: string, enum: [url] }
            url: { type: string }
            downloaded: { type: boolean }
            contentType: { type: string }
            sizeBytes: { type: integer }
        - type: object
          required: [type, filename, contentType, sizeBytes]
          properties:
            type: { type: string, enum: [file] }
            filename: { type: string }
            contentType: { type: string }
            sizeBytes: { type: integer }

    ReferenceVideoImportAnalysis:
      type: object
      required: [summary, confidence]
      properties:
        summary: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        detectedBeats:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }

    ReferenceVideoImportResult:
      type: object
      required: [source, analysis, creativeFactorsRecommendation, artifact]
      properties:
        source:
          $ref: "#/components/schemas/ReferenceVideoImportSource"
        analysis:
          $ref: "#/components/schemas/ReferenceVideoImportAnalysis"
        creativeFactorsRecommendation:
          type: object
          additionalProperties: false
          required: [recommendedFactors, confidence]
          properties:
            recommendedFactors:
              $ref: "#/components/schemas/CreativeFactors"
            confidence: { type: string, enum: [low, medium, high] }
            reasons:
              type: array
              items: { type: string }
        artifact:
          $ref: "#/components/schemas/ModuleArtifact"

    ProposeRequest:
      type: object
      additionalProperties: true
      properties:
        userDirection: { type: string }
        selectedMaterialRefs:
          type: array
          items: { type: string }
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"

    ProductBriefProposeRequest:
      type: object
      additionalProperties: false
      description: 商品卖点 propose 请求。带 draft/baseArtifactId 时用于按商家自然语言调整当前页面草稿，只生成 proposed artifact。
      properties:
        userDirection:
          type: string
          minLength: 1
          maxLength: 1000
          description: 商家本次自然语言调整要求。带 draft 或 baseArtifactId 时必填。
        title:
          type: string
          description: 可选内联表单 seed：商品标题预填字段。
        sellingPoints:
          type: string
          description: 可选内联表单 seed：卖点预填字段。
        audience:
          type: string
          description: 可选内联表单 seed：人群预填字段。
        stylePreference:
          type: string
          description: 可选内联表单 seed：风格偏好预填字段。
        draft:
          type: object
          additionalProperties: true
          description: 当前页面 ProductBriefArtifact 草稿；服务端使用 shared schema 校验。
        baseArtifactId:
          type: string
          description: 当前页面来源 product brief artifact id；服务端校验属于同一 workspace，并写入 sourceFingerprint。

    StoryboardVoiceoverProposeRequest:
      type: object
      required: [draft]
      properties:
        baseArtifactId:
          type: string
          description: 当前编辑稿来源 storyboard artifact id；用于 sourceFingerprint 追溯。
        draft:
          type: object
          additionalProperties: true
          description: 当前 15 秒三镜 storyboard draft。服务端只重写 shots[].voiceover，不改变镜头数量、顺序、时长或画面意图字段。
        userDirection:
          type: string
          description: 可选补充要求，例如“更像真实商家口播”。

    ApproveArtifactRequest:
      type: object
      properties:
        artifactId: { type: string }
        data: {}
      anyOf:
        - required: [artifactId]
        - required: [data]

    Workspace:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        localPath: { type: string, nullable: true }
        status: { type: string }
        traceFile: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceManifest:
      type: object
      required: [schemaVersion, workspaceId, currentScriptId, traceFile]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        workspaceId: { type: string }
        currentScriptId: { type: string }
        currentJobId: { type: string, nullable: true }
        traceFile: { type: string }

    WorkspaceInitializeResponse:
      type: object
      required: [workspace, manifest]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        manifest:
          $ref: "#/components/schemas/WorkspaceManifest"
        storage:
          anyOf:
            - $ref: "#/components/schemas/StorageBinding"
            - type: "null"
        name: { type: string }

    WorkspaceDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workspaceId, deleted]
          properties:
            workspaceId: { type: string }
            deleted: { type: boolean, enum: [true] }

    WorkspaceDirectorySelectResponse:
      type: object
      required: [directory, cancelled, method]
      properties:
        directory: { type: string, nullable: true }
        cancelled: { type: boolean }
        method:
          type: string
          enum: [macos, windows, linux, unsupported]

    StorageBinding:
      type: object
      required: [bound]
      properties:
        bound: { type: boolean }
        id: { type: string }
        kind: { type: string, enum: [local, s3] }
        localPath: { type: string, nullable: true }
        s3:
          anyOf:
            - type: object
              properties:
                bucket: { type: string, nullable: true }
                prefix: { type: string, nullable: true }
                region: { type: string, nullable: true }
                endpoint: { type: string, nullable: true }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceStatus:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        storage:
          anyOf:
            - $ref: "#/components/schemas/StorageBinding"
            - type: "null"
        modules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModuleState"
        activeShotSet:
          anyOf:
            - $ref: "#/components/schemas/ShotSet"
            - type: "null"
        activeOneClickFinalVideo:
          anyOf:
            - $ref: "#/components/schemas/OneClickFinalVideoJob"
            - type: "null"
        nextAction:
          type: object
          additionalProperties: true

    ShotImageRequirement:
      type: object
      additionalProperties: true
      properties:
        subject: { type: string }
        composition: { type: string }
        lighting: { type: string }
        avoid:
          type: array
          items: { type: string }

    ShotVideoRequirement:
      type: object
      additionalProperties: true
      properties:
        motion: { type: string }
        continuity: { type: string }
        durationSec: { type: integer, minimum: 4, maximum: 12 }
        avoid:
          type: array
          items: { type: string }

    ShotPromptShot:
      type: object
      required: [title, startSec, endSec, shotImage, shotVideo]
      properties:
        id: { type: string }
        title: { type: string }
        objective: { type: string }
        startSec: { type: number }
        endSec: { type: number }
        visualPrompt: { type: string }
        shotImage:
          $ref: "#/components/schemas/ShotImageRequirement"
        shotVideo:
          $ref: "#/components/schemas/ShotVideoRequirement"

    ShotSet:
      type: object
      required: [id, workspaceId, shotPromptArtifactId, status, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotPromptArtifactId: { type: string }
        status: { type: string, enum: [active, archived] }
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        shotCount:
          type: integer
          minimum: 0
          description: 该分镜链路实例包含的分镜脚本数量。
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }

    ShotRequirements:
      type: object
      required: [shotImage, shotVideo]
      properties:
        shotImage:
          $ref: "#/components/schemas/ShotImageRequirement"
        shotVideo:
          $ref: "#/components/schemas/ShotVideoRequirement"
        sourceShotPromptArtifactId: { type: string }

    Shot:
      type: object
      required: [id, workspaceId, shotSetId, orderIndex, title, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotSetId: { type: string }
        orderIndex:
          type: integer
          description: >-
            0-based workflow order derived from shot array position; not the
            provider-facing shots[].index.
        title: { type: string }
        objective: { type: string }
        defaultDurationSec: { type: integer }
        status:
          $ref: "#/components/schemas/ShotStatus"
        requirements:
          $ref: "#/components/schemas/ShotRequirements"
        selectedImage:
          anyOf:
            - $ref: "#/components/schemas/ImageSelectArtifact"
            - type: "null"
        selectedVideo:
          anyOf:
            - $ref: "#/components/schemas/VideoSelectArtifact"
            - type: "null"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        nextAction:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShotAssetRef:
      type: object
      required: [id, shotId, assetId, role, weight, position]
      properties:
        id: { type: string }
        shotId: { type: string }
        assetId: { type: string }
        role:
          type: string
          enum:
            [product_identity, reference_style, reference_scene, first_frame_hint, other]
        weight: { type: number, default: 1 }
        position: { type: integer, minimum: 0 }
        ref: { type: string }
        url: { type: string }
        metadata:
          type: object
          additionalProperties: true

    PatchShotAssetRefsRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            type: object
            required: [assetId, role]
            properties:
              assetId: { type: string }
              role:
                type: string
                enum:
                  [
                    product_identity,
                    reference_style,
                    reference_scene,
                    first_frame_hint,
                    other
                  ]
              weight: { type: number, minimum: 0, maximum: 1 }

    ImagePromptJson:
      type: object
      additionalProperties: true
      required:
        [
          promptText,
          negativePrompt,
          visualStyle,
          composition,
          lighting,
          productVisibilityRule,
          referenceImageUsage,
          qualityChecklist
        ]
      properties:
        promptText: { type: string }
        negativePrompt: { type: string, nullable: true }
        visualStyle: { type: string, nullable: true }
        composition: { type: string, nullable: true }
        lighting: { type: string, nullable: true }
        productVisibilityRule: { type: string }
        referenceImageUsage:
          type: array
          items:
            type: object
            required: [assetId, usage, instruction]
            properties:
              assetId: { type: string }
              usage:
                type: string
                enum:
                  [
                    product_identity,
                    style_reference,
                    scene_reference,
                    composition_reference
                  ]
              instruction: { type: string }
        qualityChecklist:
          type: array
          items: { type: string }
        context:
          type: object
          additionalProperties: true

    ImagePromptArtifact:
      type: object
      properties:
        id: { type: string }
        shotId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, APPROVED, STALE, ARCHIVED] }
        promptText: { type: string }
        negativePrompt: { type: string }
        referenceAssetIds:
          type: array
          items: { type: string }
        promptJson:
          $ref: "#/components/schemas/ImagePromptJson"
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdBy: { type: string, enum: [agent, user, system] }
        agentName: { type: string, nullable: true }
        baseArtifactId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ImagePromptRegenerateRequest:
      type: object
      required: [baseArtifactId, feedbackImageCandidateId, userDirection]
      additionalProperties: false
      properties:
        baseArtifactId: { type: string }
        feedbackImageCandidateId:
          type: string
          description: 必须属于当前 shot 最新 image round 的成功候选；作为本轮改稿视觉基准。
        userDirection:
          type: string
          minLength: 1
          maxLength: 1000
          description: 用户对本次重新生成的文字反馈；必填。
        candidateCount:
          type: integer
          minimum: 1
          description: 本次重新生成的候选图数量；省略时使用服务端默认值，超过运行时 max 返回 COUNT_EXCEEDS_LIMIT。

    VideoScriptJson:
      type: object
      additionalProperties: true
      required:
        [
          durationSec,
          shotGoal,
          startFrameDescription,
          endFrameDescription,
          continuityWithPrevious,
          continuityWithNext,
          cameraMotion,
          subjectMotion,
          productVisibility,
          sceneConsistency,
          voiceover,
          onscreenText,
          providerPrompt,
          negativePrompt,
          riskNotes
        ]
      properties:
        durationSec: { type: number }
        shotGoal: { type: string }
        startFrameDescription: { type: string }
        endFrameDescription: { type: string }
        continuityWithPrevious: { type: string, nullable: true }
        continuityWithNext: { type: string, nullable: true }
        cameraMotion: { type: string }
        subjectMotion: { type: string }
        productVisibility: { type: string }
        sceneConsistency: { type: string }
        voiceover: { type: string, nullable: true }
        onscreenText: { type: string, nullable: true }
        providerPrompt: { type: string }
        negativePrompt: { type: string, nullable: true }
        riskNotes:
          type: array
          items: { type: string }
        context:
          type: object
          additionalProperties: true

    VideoScriptArtifact:
      type: object
      properties:
        id: { type: string }
        shotId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, APPROVED, STALE, ARCHIVED] }
        durationSec: { type: number }
        scriptJson:
          $ref: "#/components/schemas/VideoScriptJson"
        providerPrompt: { type: string }
        basedOnImageCandidateId: { type: string, nullable: true }
        basedOnPrevImageCandidateId: { type: string, nullable: true }
        basedOnNextImageCandidateId: { type: string, nullable: true }
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdBy: { type: string, enum: [agent, user, system] }
        agentName: { type: string, nullable: true }
        baseArtifactId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    VideoScriptRegenerateRequest:
      type: object
      required: [baseArtifactId, feedbackVideoCandidateId, userDirection]
      additionalProperties: false
      properties:
        baseArtifactId: { type: string }
        feedbackVideoCandidateId:
          type: string
          description: 必须属于当前 shot 最新 video round 的成功候选；仅记录为反馈对象，不作为 provider 视频输入。
        userDirection:
          type: string
          minLength: 1
          maxLength: 1000
          description: 用户对本次重新生成的文字反馈；必填。
        candidateCount:
          type: integer
          minimum: 1
          description: 本次重新生成的候选视频数量；省略时使用服务端默认值，超过运行时 max 返回 COUNT_EXCEEDS_LIMIT。

    GenerationBatch:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestedCount: { type: integer }
        succeededCount: { type: integer }
        failedCount: { type: integer }
        provider: { type: string }
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        providerRequest: { type: object, additionalProperties: true }
        errorMessage: { type: string, nullable: true }

    ImageCandidate:
      type: object
      properties:
        id: { type: string }
        batchId: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        imageUrl: { type: string, nullable: true }
        objectKey: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        provider: { type: string }
        providerResponse: { type: object, additionalProperties: true }
        status:
          $ref: "#/components/schemas/CandidateStatus"
        errorMessage: { type: string, nullable: true }

    VideoCandidate:
      type: object
      properties:
        id: { type: string }
        batchId: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        videoUrl:
          type: string
          nullable: true
          description: Stable workspace video URL; only present after workspace storage persistence succeeds.
        previewVideoUrl:
          type: string
          nullable: true
          description: Preview URL for playback; may be a provider temporary URL while status is PERSISTING.
        objectKey: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        durationSec: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        provider: { type: string }
        providerResponse: { type: object, additionalProperties: true }
        status:
          $ref: "#/components/schemas/CandidateStatus"
        providerTaskId:
          type: string
          nullable: true
          description: Provider-side Seedance task id when available.
        providerReadyAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the provider returned a playable temporary video URL.
        persistStatus:
          type: string
          enum: [PENDING, PERSISTING, SUCCEEDED, FAILED]
          nullable: true
          description: Candidate-level persistence phase for stable workspace storage.
        errorMessage: { type: string, nullable: true }

    ImageSelectArtifact:
      type: object
      required: [id, shotId, imageCandidateId, selectedAt]
      properties:
        id: { type: string }
        shotId: { type: string }
        imageCandidateId: { type: string }
        imageGenerationBatchId: { type: string }
        selectedBy: { type: string }
        selectedAt: { type: string, format: date-time }

    VideoSelectArtifact:
      type: object
      required: [id, shotId, videoCandidateId, selectedAt]
      properties:
        id: { type: string }
        shotId: { type: string }
        videoCandidateId: { type: string }
        videoGenerationBatchId: { type: string }
        selectedBy: { type: string }
        selectedAt: { type: string, format: date-time }

    ImageSelectionView:
      type: object
      required:
        [shotId, selectedCandidateId, selectedImageUrl, nextShotId, allShotsImageSelected]
      description: >-
        当前 shot 的已确认分镜图视图。重新生成候选图不会清空或替换该选择；
        当最新 round 的 candidates 不包含 selectedCandidateId 时，selectedImageUrl
        仍指向旧轮次已确认图片，供前端继续展示当前图。
      properties:
        shotId: { type: string }
        selectedCandidateId: { type: string }
        selectedImageUrl: { type: string }
        nextShotId: { type: string, nullable: true }
        allShotsImageSelected: { type: boolean }

    VideoSelectionView:
      type: object
      required:
        [shotId, selectedCandidateId, selectedVideoUrl, duration, allShotsVideoSelected]
      description: 当前 shot 的已确认分镜视频视图。
      properties:
        shotId: { type: string }
        selectedCandidateId: { type: string }
        selectedVideoUrl: { type: string }
        duration: { type: number }
        allShotsVideoSelected: { type: boolean }

    ImageRound:
      type: object
      properties:
        artifact:
          $ref: "#/components/schemas/ImagePromptArtifact"
        batch:
          anyOf:
            - $ref: "#/components/schemas/GenerationBatch"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ImageCandidate"
        selection:
          anyOf:
            - $ref: "#/components/schemas/ImageSelectionView"
            - type: "null"
          description: >-
            当前 shot 的已确认分镜图；可能来自旧候选轮次，不要求属于本 round.candidates。
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        context: {}

    VideoRound:
      type: object
      properties:
        artifact:
          $ref: "#/components/schemas/VideoScriptArtifact"
        batch:
          anyOf:
            - $ref: "#/components/schemas/GenerationBatch"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/VideoCandidate"
        selection:
          anyOf:
            - $ref: "#/components/schemas/VideoSelectionView"
            - type: "null"
        frames:
          type: object
          properties:
            firstFrameUrl: { type: string, nullable: true }
            lastFrameUrl: { type: string, nullable: true }
            firstFrameCandidateId: { type: string, nullable: true }
            lastFrameCandidateId: { type: string, nullable: true }
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        context: {}

    CreativeTags:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          promptRequirementsArtifactId,
          shotPromptArtifactId,
          creativeFactors,
          creativeRequirementTemplate,
          fallback
        ]
      properties:
        schemaVersion: { type: string, const: creative-tags.v1 }
        promptRequirementsArtifactId: { type: string, nullable: true }
        shotPromptArtifactId: { type: string, nullable: true }
        creativeFactors:
          anyOf:
            - $ref: "#/components/schemas/CreativeFactors"
            - type: "null"
        creativeRequirementTemplate:
          anyOf:
            - $ref: "#/components/schemas/CreativeRequirementTemplateSource"
            - type: "null"
        fallback:
          type: boolean
          description: true 表示成片时从 current prompt requirements 回退读取 tags，而非从 shot set 指向的 artifact 读取。

    FinalVideoManifest:
      type: object
      additionalProperties: true
      properties:
        schemaVersion: { type: string, const: final-video.v1 }
        workspaceId: { type: string }
        creativeTags:
          $ref: "#/components/schemas/CreativeTags"

    FinalVideoJob:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotSetId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        outputAspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        sourceVideoCandidateIds:
          type: array
          items: { type: string }
        sourceVideoScriptArtifactIds:
          type: array
          items: { type: string }
        localUrl: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        compiledManifest:
          $ref: "#/components/schemas/FinalVideoManifest"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImportDashboardVideoRequest:
      type: object
      required: [finalVideoJobId, name]
      additionalProperties: false
      properties:
        finalVideoJobId:
          type: string
          minLength: 1
          description: 必须属于当前 workspace，且成片作业 status=SUCCEEDED、已有 localUrl/localPath。
        name:
          type: string
          minLength: 1
          description: 数据面板视频展示名称。

    DashboardVideoArtifact:
      type: object
      required:
        [
          id,
          workspaceId,
          name,
          localUrl,
          creativeTags,
          metadata,
          importedAt,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        finalVideoJobId: { type: string, nullable: true }
        name: { type: string }
        localUrl:
          type: string
          description: 数据面板全局 stable API URL，例如 /api/dashboard/videos/{artifactId}/file。
        durationSec: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        creativeTags:
          $ref: "#/components/schemas/CreativeTags"
        creativeFactors:
          anyOf:
            - $ref: "#/components/schemas/CreativeFactors"
            - type: "null"
        metadata:
          type: object
          additionalProperties: true
          description: final video manifest hash、完成时间和来源候选/脚本 id 等快照。
        importedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OneClickFinalVideoJob:
      type: object
      required:
        [
          id,
          workspaceId,
          status,
          currentStage,
          autoSelectionStrategy,
          outputAspectRatio,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED]
        currentStage:
          type: string
          enum:
            - product_brief
            - storyboard
            - shotprompt
            - shot_set
            - image_selection
            - video_selection
            - final_compose
            - completed
        stageState:
          type: object
          additionalProperties: true
          description: Durable stage metadata. Frontend derives one-click progress from currentStage, image/video selectedCandidateIdsByShotId, image.currentIndex, and active shot count.
        materialIntakeArtifactId: { type: string, nullable: true }
        productBriefArtifactId: { type: string, nullable: true }
        storyboardArtifactId: { type: string, nullable: true }
        shotPromptArtifactId: { type: string, nullable: true }
        shotSetId: { type: string, nullable: true }
        finalVideoJobId: { type: string, nullable: true }
        autoSelectionStrategy:
          type: string
          enum: [first_success]
        outputAspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    ShotImageAutoSelectionJob:
      type: object
      required:
        [
          id,
          workspaceId,
          status,
          currentStage,
          candidateCount,
          autoSelectionStrategy,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED]
        currentStage:
          type: string
          enum: [image_selection, completed]
        stageState:
          type: object
          additionalProperties: true
          description: 保存当前分镜 index、每镜 image batch id 和已自动选择的 candidate id。
        shotSetId: { type: string, nullable: true }
        candidateCount:
          type: integer
          minimum: 1
        autoSelectionStrategy:
          type: string
          enum: [first_success]
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    CampaignPublication:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        finalVideoJobId: { type: string, nullable: true }
        platform: { type: string }
        channelName: { type: string }
        kolName: { type: string, nullable: true }
        publishUrl: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        creativeTags:
          type: object
          additionalProperties: true
          description: 从 finalVideoJob.compiledManifest.creativeTags 快照而来；未绑定成片时为空对象。
        latestMetrics:
          anyOf:
            - $ref: "#/components/schemas/CampaignMetric"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignMetric:
      type: object
      properties:
        id: { type: string }
        publicationId: { type: string }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        spendCents: { type: integer }
        ctr: { type: number }
        source: { type: string }
        metadata: { type: object, additionalProperties: true }
        capturedAt: { type: string, format: date-time }

paths:
  /api/health:
    get:
      tags: [Platform]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  runtime: { type: string, enum: [all, api, worker] }

  /api/config/limits:
    get:
      tags: [Platform]
      summary: 获取候选数量、并发、workspace storage 和宽高比限制
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      defaultImageCandidates: { type: integer }
                      maxImageCandidatesPerShot: { type: integer }
                      defaultVideoCandidates: { type: integer }
                      maxVideoCandidatesPerShot: { type: integer }
                      generationWorkerConcurrency: { type: integer }
                      providerConcurrency:
                        type: object
                        properties:
                          text: { type: integer }
                          image: { type: integer }
                          video: { type: integer }
                      workspaceStorageKind:
                        type: string
                        enum: [local, s3]
                      aspectRatios:
                        type: array
                        items:
                          $ref: "#/components/schemas/AspectRatio"

  /api/pipeline/contracts:
    get:
      tags: [Platform]
      summary: 获取 agent/prompt/schema 契约元数据
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/setup-templates/creative-requirements:
    get:
      tags: [SetupTemplate]
      summary: 获取内置创作要求模板
      description: >
        返回 server 启动时从 @aigc-video/shared setup_template 校验通过的创作要求模板。
        只用于前端填充首屏主因子、visualStyle、9 个细分字段和 7 项编译预览草稿；
        不创建 artifact、不 approve、不触发素材解读，也不支持运行时编辑模板。
      responses:
        "200":
          description: Creative requirement templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRequirementTemplatesResponse"

  /api/test-runs/{runId}:
    delete:
      tags: [Platform]
      summary: 测试清理专用
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: integer }
        "403":
          $ref: "#/components/responses/Error"

  /api/materials:
    post:
      tags: [Material]
      summary: 登记外部商品图
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl: { type: string }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/materials/product-image:
