  /api/workspaces/{workspaceId}/shots/{shotId}/image-rounds:
    get:
      tags: [Shot]
      summary: 获取图像生成轮次
      description: >-
        按 image prompt artifact 聚合候选图轮次。selection 表示当前 shot 已确认分镜图；
        重新生成候选图不会清空该选择，所以最新 round 的 candidates 仍在生成时，
        客户端应继续用 selection.selectedImageUrl 展示当前图。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Image rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRound"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-candidates/select:
    post:
      tags: [Shot]
      summary: 选择当前图像候选
      description: UPSERT image_select_artifacts，不 stale 未选候选。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [candidateId]
                - required: [imageCandidateId]
              properties:
                candidateId: { type: string }
                imageCandidateId: { type: string }
                imageGenerationBatchId: { type: string }
      responses:
        "200":
          description: Current image selection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImageSelectionView"
                  shotId: { type: string }
                  selectedCandidateId: { type: string }
                  selectedImageUrl: { type: string }
                  nextShotId: { type: string, nullable: true }
                  allShotsImageSelected: { type: boolean }
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-scripts/propose:
    post:
      tags: [Shot]
      summary: 确定性装配视频脚本并异步入队每候选一个视频生成 job
      description: >
        读取当前镜头目标 providerPrompt、shotVideo、当前 selected image 首帧、下一镜
        selected image 尾帧、duration、voiceover 和 voice profile，写 ACTIVE
        video_script_artifacts 后，每个候选入队一个 generate_video_candidate job
        并立即返回 PENDING batch + PENDING candidates；shot 进入 VIDEO_GENERATING。
        客户端轮询 video-rounds 直到 VIDEO_CANDIDATES_READY；provider 已返回临时 mp4
        但仍在保存素材的候选会以 PERSISTING + previewVideoUrl 暴露，不能选择或成片。
        video 同时在飞的 Seedance
        调用数被进程级信号量限制为 VIDEO_PROVIDER_CONCURRENCY。Seedance task-create
        阶段的账号 RPM 429 立即交给 generate_video_candidate 队列重试并释放 provider
        slot；task polling 阶段的 429/5xx/超时仍做退避重试。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userDirection: { type: string }
                candidateCount:
                  type: integer
                  minimum: 1
                  description: 本次生成的候选视频数量；省略时使用服务端默认值，超过运行时 max 返回 COUNT_EXCEEDS_LIMIT。
      responses:
        "200":
          description: Video script artifact plus a PENDING batch with PENDING candidates (poll video-rounds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  artifact:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoCandidate"
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true
                  frames:
                    type: object
                    properties:
                      firstFrameCandidateId: { type: string }
                      lastFrameCandidateId: { type: string, nullable: true }
                      firstFrameUrl: { type: string, nullable: true }
                      lastFrameUrl: { type: string, nullable: true }
                  poll:
                    type: object
                    properties:
                      videoRoundsUrl: { type: string }
                      batchId: { type: string }
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-scripts/regenerate:
    post:
      tags: [Shot]
      summary: 用户反馈后重新装配 video script 并生成候选视频
      description: >-
        基于 base video script artifact、最新轮成功反馈视频候选、当前镜头目标
        providerPrompt、shotVideo、首尾帧、duration、voiceover 和 voice profile，
        用后端确定性 assembler 创建新的 user-created video script artifact 和 video
        batch。feedbackVideoCandidateId 只记录为反馈对象和 trace，不作为 Seedance
        视频输入。不会清空当前 selected video。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoScriptRegenerateRequest"
      responses:
        "200":
          description: User-feedback video script artifact plus a PENDING batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  artifact:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoCandidate"
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true
                  frames:
                    type: object
                    properties:
                      firstFrameCandidateId: { type: string }
                      lastFrameCandidateId: { type: string, nullable: true }
                      firstFrameUrl: { type: string, nullable: true }
                      lastFrameUrl: { type: string, nullable: true }
                  poll:
                    type: object
                    properties:
                      videoRoundsUrl: { type: string }
                      batchId: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/shots/{shotId}/video-scripts:
    get:
      tags: [Shot]
