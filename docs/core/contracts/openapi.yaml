  /api/workspaces/{workspaceId}/reference-video/import:
    post:
      tags: [ModuleArtifacts]
      summary: 从参考视频推荐创作因子并创建 prompt requirements 草稿
      description: >
        模型只返回参考视频分析和主因子推荐；visualStyle 可省略并默认 authentic；
        后端用推荐因子确定性编译 prompt requirements，
        创建或覆盖 proposed prompt_requirements_artifacts。不会 approve requirements，也不会把
        参考视频登记到素材库。仅当 workspace 尚无 current approved prompt requirements 时可调用。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceVideoImportRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Reference video factor recommendation and proposed requirements artifact
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ReferenceVideoImportResult"
        "400":
          description: Unsupported URL/file, non-direct video URL, unsafe URL, or size/type violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Current approved prompt requirements already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

