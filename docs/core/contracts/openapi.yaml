              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShotImageAutoSelectionJob"

  /api/workspaces/{workspaceId}/one-click-final-videos:
    get:
      tags: [Generation]
      summary: 列出一键成片任务
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: One-click final video jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OneClickFinalVideoJob"
    post:
      tags: [Generation]
      summary: 从素材解读草稿启动全自动一键成片
      description: >-
        独立于“批准素材解读并生成商品卖点”的手动链路。后端先用请求里的
        materialIntake.data 批准当前素材解读，再自动 propose/approve 商品卖点、
        分镜脚本、分镜生成要求，应用分镜链路实例，生成并选择首个成功的分镜图/分镜视频，
        最后创建成片任务。同一 workspace 同时只允许一个 PENDING/RUNNING/WAITING
        一键任务。一键成片内部每镜 image/video 生成固定 candidateCount=1；后端不返回
        progress percent，前端从 OneClickFinalVideoJob 阶段事实派生进度并负责轮询。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materialIntake]
              properties:
                materialIntake:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      additionalProperties: true
                      description: MaterialIntakeArtifact from @aigc-video/shared.
                outputAspectRatio:
                  $ref: "#/components/schemas/AspectRatio"
                autoSelectionStrategy:
                  type: string
                  enum: [first_success]
      responses:
        "200":
          description: One-click final video job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OneClickFinalVideoJob"
                  deduped:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

