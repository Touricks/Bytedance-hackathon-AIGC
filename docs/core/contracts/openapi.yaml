                filename: { type: string }
                contentType: { type: string }
                dataBase64: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/prompt-requirements:
