  /api/dashboard/recommendations:
    get:
      tags: [Dashboard]
      summary: 投放策略推荐
      description: >
        For every (商品一级类目 productCategory × 商品成交类型 dealType) group that
        has dashboard videos with external-KOL metrics, recommends the best
        适用人群 (audience) and 推销手法 (strategy) by a composite of average ROAS
        (Σgmv/Σspend) and per-video GMV. Read-only; aggregates across all
        workspaces. Returns `RecommendationResult` (schemaVersion `recommendation.v1`).
      parameters:
        - $ref: "#/components/parameters/RoasWeight"
        - $ref: "#/components/parameters/GmvWeight"
        - $ref: "#/components/parameters/PriorStrength"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /api/dashboard/recommendations/{productCategory}/{dealType}:
    get:
      tags: [Dashboard]
      summary: 单分组投放策略推荐
      description: >
        Recommendation for a single (商品一级类目 × 商品成交类型) group. Responds
        `{ data: GroupRecommendation, meta }`; 404 when the group has no data.
      parameters:
        - $ref: "#/components/parameters/ProductCategory"
        - $ref: "#/components/parameters/DealType"
        - $ref: "#/components/parameters/RoasWeight"
        - $ref: "#/components/parameters/GmvWeight"
        - $ref: "#/components/parameters/PriorStrength"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

