                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageCandidate"
                  usage: { nullable: true }
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true

  /api/workspaces/{workspaceId}/shots/{shotId}/image-prompts/regenerate:
    post:
      tags: [Shot]
      summary: 用户反馈后重新装配 image prompt 并生成候选图
      description: >-
        基于 base image prompt artifact、最新轮成功反馈候选、当前镜头目标
        providerPrompt、shotImage 和用户反馈，用后端确定性 assembler 创建新的
        user-created image prompt artifact 和 image batch。feedbackImageCandidateId
        的图片作为 Seedream 第一参考图；本镜素材图随后；上一镜 selected image
        最后用于连续性。不清空当前 selected image，旧候选仍保留可回看。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePromptRegenerateRequest"
      responses:
        "200":
          description: User-feedback image prompt artifact and new batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  artifact:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageCandidate"
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

