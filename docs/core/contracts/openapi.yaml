  /api/workspaces/{workspaceId}/shot-workflow-status:
    get:
      tags: [Shot]
      summary: 获取 active shot set 的整体工作流状态
      description: Workspace 存在但尚未生成 active shot set 时返回空 shots 和 canComposeFinalVideo=false；shot 级操作仍要求 active shot set。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workflow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaceId: { type: string }
                      canComposeFinalVideo: { type: boolean }
                      shots:
                        type: array
                        items:
                          type: object
                          properties:
                            shotId: { type: string }
                            orderIndex: { type: integer }
                            status: { type: string }
                            nextAction: { type: string }
                            activeImagePromptArtifactId:
                              type: string
                              nullable: true
                            selectedImageId:
                              type: string
                              nullable: true
                            selectedImageUrl:
                              type: string
                              nullable: true
                              description: >-
                                当前 shot 已选分镜图候选的图片 URL；未选择或候选尚无 URL 时为 null。
                                供创作审核台分镜列表直接渲染缩略图，无需逐 shot 调用 image-rounds。
                            activeVideoScriptArtifactId:
                              type: string
                              nullable: true
                            selectedVideoId:
                              type: string
                              nullable: true
                            activeImageBatchId:
                              type: string
                              nullable: true
                            activeVideoBatchId:
                              type: string
                              nullable: true
                            activeVideoBatchStatus:
                              allOf:
                                - $ref: "#/components/schemas/BatchStatus"
                              nullable: true
                              description: 最新视频 batch 的状态；PENDING/RUNNING 表示仍在生成，前端不得重复批量提交。
                            upstream:
                              $ref: "#/components/schemas/UpstreamChange"
                            videoUpstream:
                              allOf:
                                - $ref: "#/components/schemas/UpstreamChange"
                              description: 仅表示视频脚本/视频候选相对最新首尾帧、shotprompt、voice profile 等视频输入是否过期。

  /api/workspaces/{workspaceId}/shot-image-auto-selections:
    get:
      tags: [Generation]
      summary: 列出分镜图自动选择任务
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Shot image auto-selection jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShotImageAutoSelectionJob"
    post:
      tags: [Generation]
      summary: 批量生成并自动选择分镜图
      description: >-
        按当前 active shot set 的镜头顺序推进。已有 selected image 的镜头会跳过；
        未选择的镜头创建 image batch，等待 batch 完成后选择首个 SUCCEEDED 且已有 stable URL
        的候选图。任务只处理分镜图，不生成分镜视频或成片。同一 workspace 同时只允许一个
        PENDING/RUNNING/WAITING 自动选图任务。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                candidateCount:
                  type: integer
                  minimum: 1
                  description: 每镜候选图数量；省略时使用服务端默认值，超过运行时 max 返回 COUNT_EXCEEDS_LIMIT。
      responses:
        "200":
          description: Shot image auto-selection job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShotImageAutoSelectionJob"
                  deduped:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/shot-image-auto-selections/{jobId}:
