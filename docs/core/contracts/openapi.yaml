      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, dataBase64]
              properties:
                filename: { type: string }
                contentType: { type: string }
                dataBase64: { type: string }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspaces:
    get:
      tags: [Workspace]
      summary: 列出可见工作区（DB 已登记 + 磁盘发现的未登记草稿）
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    description: >-
                      DB 已登记工作区（含 active storage binding）。S3 workspace 即使 localPath
                      为空也展示；LOCAL workspace 需要有效本地路径。配置 WORKSPACE_DISCOVERY_ROOTS
                      时，仅限制 LOCAL workspace 的可见 roots。
                    items:
                      $ref: "#/components/schemas/Workspace"
                  discovered:
                    type: array
                    description: >-
                      WORKSPACE_DISCOVERY_ROOTS 下扫描到的、磁盘存在 .daireel/workspace.json
                      但 DB 无对应行的工作区（已按路径去重剔除已登记项）。点击经 init 重新打开会复用其原始 workspaceId。
                    items:
                      type: object
                      properties:
                        localPath: { type: string }
                        workspaceId:
                          type: string
                          nullable: true
                      required: [localPath]
    post:
      tags: [Workspace]
      summary: 创建逻辑工作区
      description: >-
        WORKSPACE_STORAGE_KIND=s3 时自动绑定私有 S3-compatible bucket，
        prefix 固定为 workspaces/{workspaceId}。local 模式仍由 /api/workspaces/init
        绑定本地目录，前端不应把未绑定逻辑 workspace 作为可见草稿。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInitializeResponse"

  /api/workspaces/directory/select:
    post:
      tags: [Workspace]
      summary: 打开本机目录选择器
      description: >-
        由桌面/本地开发环境使用。返回用户选择的本地 workspace 目录；
        不创建 workspace，不写 storage binding。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Selected directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDirectorySelectResponse"

  /api/workspaces/init:
    post:
      tags: [Workspace]
      summary: 按本地目录初始化工作区
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directory]
              properties:
                directory: { type: string }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInitializeResponse"

  /api/workspaces/{workspaceId}:
    delete:
      tags: [Workspace]
      summary: 删除已登记工作区
      description: >-
        同步 MVP：仅删除 DB 已登记 workspace。先检查 PENDING/RUNNING 生成或成片任务；
        LOCAL storage 会删除工作目录下的 .daireel/ 创作状态目录，S3 storage 会删除
        active binding 的 prefix 下对象；随后清理该 workspace 的业务记录。不会删除
        LOCAL 工作目录中的其他文件。.daireel/ 或 S3 prefix 已不存在时仍视为成功。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeleteResponse"
        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/status:
    get:
      tags: [Workspace]
      summary: 获取工作区状态、artifact 摘要和 active shot set
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"

  /api/workspaces/{workspaceId}/storage:
    get:
      tags: [Workspace]
      summary: 获取存储绑定
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Storage binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/StorageBinding"
                      - type: "null"

  /api/workspaces/{workspaceId}/storage/bind:
    post:
      tags: [Workspace]
      summary: 绑定 LOCAL 或 S3 storage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, localPath]
                  properties:
                    kind: { type: string, enum: [local] }
                    localPath: { type: string }
                - type: object
                  required: [kind, bucket, prefix]
                  properties:
                    kind: { type: string, enum: [s3] }
                    bucket: { type: string }
                    prefix: { type: string }
                    region: { type: string }
                    endpoint: { type: string }
      responses:
        "200":
          description: Storage binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StorageBinding"
        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/materials:
    post:
      tags: [Material]
      summary: 上传工作区素材
      description: image/* 文件超过 10MB 返回 400 IMAGE_TOO_LARGE_FOR_MODEL；非图片仍使用通用 50MB 上限。
      parameters:
