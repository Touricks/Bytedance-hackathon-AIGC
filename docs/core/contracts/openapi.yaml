              properties:
                userDirection: { type: string }
                candidateCount:
                  type: integer
                  minimum: 1
                  description: 本次生成的候选图数量；省略时使用服务端默认值，超过运行时 max 返回 COUNT_EXCEEDS_LIMIT。
      responses:
        "200":
          description: Image prompt artifact and batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  artifact:
