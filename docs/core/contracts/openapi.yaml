          description: Publication
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CampaignPublication"

  /api/workspaces/{workspaceId}/campaign-publications/{publicationId}/metrics:
    post:
      tags: [Campaign]
      summary: 写入发布指标
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PublicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                impressions: { type: integer, default: 0 }
                clicks: { type: integer, default: 0 }
                conversions: { type: integer, default: 0 }
                spendCents: { type: integer, default: 0 }
                capturedAt: { type: string, format: date-time }
                source: { type: string, default: manual }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Metric
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CampaignMetric"

  /api/workspaces/{workspaceId}/traces:
    get:
      tags: [Trace]
      summary: 分页列工作区 trace events
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trace events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/shots/{shotId}/traces:
    get:
      tags: [Trace]
      summary: 分页列 shot trace events
      parameters:
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trace events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspaces/{workspaceId}/videos/{wildcard}:
    get:
      tags: [Workspace]
      summary: 流式返回工作区视频文件
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Wildcard"
      responses:
        "200":
          description: Video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /api/workspaces/{workspaceId}/materials/{wildcard}:
    get:
      tags: [Workspace]
      summary: 流式返回工作区素材文件
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Wildcard"
      responses:
        "200":
          description: Material file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    delete:
      tags: [Material]
      summary: 删除工作区素材
      description: 删除 workspace `.daireel/materials/:ref` 文件、对应 asset 记录和 shot asset refs；不会自动重跑下游链路。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Wildcard"
      responses:
        "200":
          description: Deleted material
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [workspaceId, ref, deleted]
                    properties:
                      workspaceId: { type: string }
                      ref: { type: string }
                      deleted: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
