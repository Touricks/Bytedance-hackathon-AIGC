              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VideoSelectionView"
                  shotId: { type: string }
                  selectedCandidateId: { type: string }
                  selectedVideoUrl: { type: string }
                  duration: { type: number }
                  allShotsVideoSelected: { type: boolean }
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/shots/{shotId}/retry:
    post:
      tags: [Shot]
      summary: 对当前 active prompt/script 重试生成 batch
      parameters:
        - $ref: "#/components/parameters/ShotId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
