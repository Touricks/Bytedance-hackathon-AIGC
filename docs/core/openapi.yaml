        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shot-workflow-status:
    get:
      tags: [Shot]
      summary: 获取 active shot set 的整体工作流状态
      description: Workspace 存在但尚未生成 active shot set 时返回空 shots 和 canComposeFinalVideo=false；shot 级操作仍要求 active shot set。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workflow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaceId: { type: string }
                      canComposeFinalVideo: { type: boolean }
                      shots:
                        type: array
                        items:
                          type: object
                          properties:
                            shotId: { type: string }
                            orderIndex: { type: integer }
                            status: { type: string }
                            nextAction: { type: string }
                            activeImagePromptArtifactId:
                              type: string
                              nullable: true
                            selectedImageId:
                              type: string
                              nullable: true
                            selectedImageUrl:
                              type: string
                              nullable: true
                              description: >-
                                当前 shot 已选分镜图候选的图片 URL；未选择或候选尚无 URL 时为 null。
                                供创作审核台分镜列表直接渲染缩略图，无需逐 shot 调用 image-rounds。
                            activeVideoScriptArtifactId:
                              type: string
                              nullable: true
                            selectedVideoId:
                              type: string
                              nullable: true
                            activeImageBatchId:
                              type: string
                              nullable: true
                            activeVideoBatchId:
                              type: string
                              nullable: true
                            upstream:
                              $ref: "#/components/schemas/UpstreamChange"

