                      $ref: "#/components/schemas/VideoRound"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-candidates/select:
    post:
      tags: [Shot]
      summary: 选择当前视频候选
      description: UPSERT video_select_artifacts，不 stale 未选候选。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
