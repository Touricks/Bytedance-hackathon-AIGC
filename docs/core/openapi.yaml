  /api/workspaces/{workspaceId}/shots/{shotId}/image-prompts/propose:
    post:
      tags: [Shot]
      summary: 运行图像 prompt agent 并创建图像候选 batch
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userDirection: { type: string }
      responses:
        "200":
          description: Image prompt artifact and batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  artifact:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageCandidate"
                  usage: { nullable: true }
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true

  /api/workspaces/{workspaceId}/shots/{shotId}/image-prompts/regenerate:
    post:
      tags: [Shot]
      summary: 用户反馈后重新装配 image prompt 并生成候选图
      description: >-
        基于 base image prompt artifact、当前 shotImage/shotVideo 和用户反馈重新调用
        image-prompt agent，创建新的 user-created image prompt artifact 和 image batch。
        不清空当前 selected image，旧候选仍保留可回看。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePromptRegenerateRequest"
      responses:
        "200":
          description: User-feedback image prompt artifact and new batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  artifact:
                    $ref: "#/components/schemas/ImagePromptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageCandidate"
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

  /api/shots/{shotId}/image-prompts:
    get:
      tags: [Shot]
      summary: 列出 shot 图像 prompt artifacts
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Image prompt artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImagePromptArtifact"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-rounds:
    get:
      tags: [Shot]
      summary: 获取图像生成轮次
      description: >-
        按 image prompt artifact 聚合候选图轮次。selection 表示当前 shot 已确认分镜图；
        重新生成候选图不会清空该选择，所以最新 round 的 candidates 仍在生成时，
        客户端应继续用 selection.selectedImageUrl 展示当前图。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Image rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRound"

  /api/workspaces/{workspaceId}/shots/{shotId}/image-candidates/select:
    post:
      tags: [Shot]
      summary: 选择当前图像候选
      description: UPSERT image_select_artifacts，不 stale 未选候选。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [candidateId]
                - required: [imageCandidateId]
              properties:
                candidateId: { type: string }
                imageCandidateId: { type: string }
                imageGenerationBatchId: { type: string }
      responses:
        "200":
          description: Current image selection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImageSelectionView"
                  shotId: { type: string }
                  selectedCandidateId: { type: string }
                  selectedImageUrl: { type: string }
                  nextShotId: { type: string, nullable: true }
                  allShotsImageSelected: { type: boolean }
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-scripts/propose:
    post:
      tags: [Shot]
      summary: 运行视频脚本 agent，异步入队每候选一个视频生成 job
      description: >
        写 ACTIVE video_script_artifacts 后，每个候选入队一个 generate_video_candidate
        job 并立即返回 PENDING batch + PENDING candidates；shot 进入 VIDEO_GENERATING。
        客户端轮询 video-rounds 直到 VIDEO_CANDIDATES_READY。video 同时在飞的 Seedance
        调用数被进程级信号量限制为 VIDEO_PROVIDER_CONCURRENCY，并对 429/限流做退避重试。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userDirection: { type: string }
      responses:
        "200":
          description: Video script artifact plus a PENDING batch with PENDING candidates (poll video-rounds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  artifact:
                    $ref: "#/components/schemas/VideoScriptArtifact"
                  batch:
                    $ref: "#/components/schemas/GenerationBatch"
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoCandidate"
                  shotStatus:
                    $ref: "#/components/schemas/ShotStatus"
                  nextAction:
                    type: object
                    additionalProperties: true
                  traceId: { type: string }
                  context:
                    type: object
                    additionalProperties: true
                  frames:
                    type: object
                    properties:
                      firstFrameCandidateId: { type: string }
                      lastFrameCandidateId: { type: string, nullable: true }
                      firstFrameUrl: { type: string, nullable: true }
                      lastFrameUrl: { type: string, nullable: true }
                  poll:
                    type: object
                    properties:
                      videoRoundsUrl: { type: string }
                      batchId: { type: string }
        "400":
          $ref: "#/components/responses/Error"

  /api/shots/{shotId}/video-scripts:
    get:
      tags: [Shot]
      summary: 列出 shot 视频脚本 artifacts
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Video script artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoScriptArtifact"

  /api/workspaces/{workspaceId}/shots/{shotId}/video-rounds:
    get:
      tags: [Shot]
      summary: 获取视频生成轮次
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Video rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
