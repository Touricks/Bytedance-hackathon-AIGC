openapi: 3.1.0
info:
  title: ecommerce-aigc-video API
  version: 2.0.0
  description: >
    V2 目标后端契约。全部路由前缀 /api，URL 无版本号，全站无鉴权。
    工作区级 agent 模块采用 propose -> approve 语义：propose 只生成待审 artifact，
    approve 才变为当前生效 artifact；下游只读取 approved/current。
    approve 不级联重置下游，shotprompt approve 也不重建 shots。
    新的分镜链路由显式创建 shot set 触发。上游变更通过 upstreamChanged 提示表达，
    不代表 stale，也不删除候选或选择。图像/视频选择写入 image_select_artifacts /
    video_select_artifacts，每个 shot 只有一个当前 selected image/video，重复选择用 UPSERT 覆盖。
    业务语义见 docs/core/interface.md，架构见 docs/core/arc_v2.md，数据模型见 docs/core/erd.md。
servers:
  - url: http://localhost:3000
    description: 本地开发（SERVER_PORT 默认 3000）
tags:
  - name: Platform
  - name: Material
  - name: Workspace
  - name: ModuleArtifacts
  - name: ShotSet
  - name: Shot
  - name: Generation
  - name: Campaign
  - name: Trace

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string }
    ShotSetId:
      name: shotSetId
      in: path
      required: true
      schema: { type: string }
    ShotId:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    FinalVideoJobId:
      name: finalVideoJobId
      in: path
      required: true
      schema: { type: string }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    Wildcard:
      name: wildcard
      in: path
      required: true
      description: Fastify 通配子路径。
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    Error:
      description: 业务错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleArtifactEnvelope:
      description: 模块 artifact 响应。
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/ModuleArtifact"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}

    AspectRatio:
      type: string
      enum: ["9:16", "16:9", "1:1"]
      default: "9:16"

    ArtifactStatus:
      type: string
      enum: [proposed, approved, archived, failed]

    BatchStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED]

    CandidateStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, REJECTED]

    ShotStatus:
      type: string
      enum:
        - DRAFT
        - IMAGE_PROMPT_PROPOSING
        - IMAGE_PROMPT_READY
        - IMAGE_GENERATING
        - IMAGE_CANDIDATES_READY
        - IMAGE_SELECTED
        - VIDEO_SCRIPT_PROPOSING
        - VIDEO_SCRIPT_READY
        - VIDEO_GENERATING
        - VIDEO_CANDIDATES_READY
        - VIDEO_SELECTED
        - FAILED

    UpstreamChange:
      type: object
      required: [upstreamChanged, changedSources]
      properties:
        upstreamChanged: { type: boolean }
        changedSources:
          type: array
          items: { type: string }
        message: { type: string }

    SourceFingerprint:
      type: object
      additionalProperties: true
      description: 生成本产物时读取的上游 artifact id/hash。
      properties:
        promptRequirementsArtifactId: { type: string }
        materialIntakeArtifactId: { type: string }
        productBriefArtifactId: { type: string }
        storyboardArtifactId: { type: string }
        baseStoryboardArtifactId:
          { type: string, nullable: true, description: storyboard 局部重写所基于的原 artifact。 }
        rewriteKind:
          { type: string, description: 局部重写类型，例如 voiceover。 }
        shotPromptArtifactId: { type: string }
        shotSetId: { type: string }

    PromptAssemblyMetadata:
      type: object
      additionalProperties: true
      required:
        [
          moduleId,
          assemblerVersion,
          subjectTemplateId,
          contractTemplateId,
          subjectHash,
          contractHash
        ]
      properties:
        moduleId: { type: string }
        subjectTemplateId:
          {
            type: string,
            description: 主体创作 prompt 模板，例如 shotprompt/subject.md。
          }
        contractTemplateId:
          { type: string, description: 输入 artifact 与输出 schema 契约模板。 }
        subjectHash: { type: string, description: subject.md 内容 SHA-256。 }
        contractHash: { type: string, description: contract.md 内容 SHA-256。 }
        assemblerVersion: { type: string }
        requirementArtifactId: { type: string }
        provider: { type: string }
        model: { type: string }
        preview:
          { type: string, description: 短 preview；完整 assembled prompt 写 trace。 }

    ModuleArtifact:
      type: object
      required: [id, workspaceId, moduleId, status, isCurrent, data, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        moduleId:
          type: string
          enum:
            [prompt-requirements, material-intake, product-brief, storyboard, shotprompt]
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        isCurrent: { type: boolean }
        data: {}
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }

    ModuleState:
      type: object
      required: [moduleId]
      properties:
        moduleId: { type: string }
        proposed:
          anyOf:
            - $ref: "#/components/schemas/ModuleArtifact"
            - type: "null"
        current:
          anyOf:
            - $ref: "#/components/schemas/ModuleArtifact"
            - type: "null"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"

    PromptRequirementData:
      type: object
      additionalProperties: true
      properties:
        image: { type: object, additionalProperties: true }
        script: { type: object, additionalProperties: true }
        storyboard: { type: object, additionalProperties: true }
        shotImage: { type: object, additionalProperties: true }
        shotVideo: { type: object, additionalProperties: true }

    ReferenceVideoImportRequest:
      type: object
      required: [source]
      properties:
        source:
          type: object
          required: [type, url]
          properties:
            type: { type: string, enum: [url] }
            url:
              type: string
              description: 可直接下载的视频 URL；平台落地页/HTML 不支持。

    ReferenceVideoImportSource:
      oneOf:
        - type: object
          required: [type, url, downloaded, contentType, sizeBytes]
          properties:
            type: { type: string, enum: [url] }
            url: { type: string }
            downloaded: { type: boolean }
            contentType: { type: string }
            sizeBytes: { type: integer }
        - type: object
          required: [type, filename, contentType, sizeBytes]
          properties:
            type: { type: string, enum: [file] }
            filename: { type: string }
            contentType: { type: string }
            sizeBytes: { type: integer }

    ReferenceVideoImportAnalysis:
      type: object
      required: [summary, confidence]
      properties:
        summary: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        detectedBeats:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }

    ReferenceVideoImportResult:
      type: object
      required: [source, draft, analysis]
      properties:
        source:
          $ref: "#/components/schemas/ReferenceVideoImportSource"
        draft:
          $ref: "#/components/schemas/PromptRequirementData"
        analysis:
          $ref: "#/components/schemas/ReferenceVideoImportAnalysis"

    ProposeRequest:
      type: object
      additionalProperties: true
      properties:
        userDirection: { type: string }
        selectedMaterialRefs:
          type: array
          items: { type: string }
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"

    ProductBriefProposeRequest:
      type: object
      additionalProperties: false
      description: 商品卖点 propose 请求。带 draft/baseArtifactId 时用于按商家自然语言调整当前页面草稿，只生成 proposed artifact。
      properties:
        userDirection:
          type: string
          minLength: 1
          maxLength: 1000
          description: 商家本次自然语言调整要求。带 draft 或 baseArtifactId 时必填。
        title:
          type: string
          description: 兼容旧入口的商品标题预填字段。
        sellingPoints:
          type: string
          description: 兼容旧入口的卖点预填字段。
        audience:
          type: string
          description: 兼容旧入口的人群预填字段。
        stylePreference:
          type: string
          description: 兼容旧入口的风格偏好预填字段。
        draft:
          type: object
          additionalProperties: true
          description: 当前页面 ProductBriefArtifact 草稿；服务端使用 shared schema 校验。
        baseArtifactId:
          type: string
          description: 当前页面来源 product brief artifact id；服务端校验属于同一 workspace，并写入 sourceFingerprint。

    StoryboardVoiceoverProposeRequest:
      type: object
      required: [draft]
      properties:
        baseArtifactId:
          type: string
          description: 当前编辑稿来源 storyboard artifact id；用于 sourceFingerprint 追溯。
        draft:
          type: object
          additionalProperties: true
          description: 当前 15 秒三镜 storyboard draft。服务端只重写 shots[].voiceover，不改变镜头数量、顺序、时长或画面意图字段。
        userDirection:
          type: string
          description: 可选补充要求，例如“更像真实商家口播”。

    ApproveArtifactRequest:
      type: object
      properties:
        artifactId: { type: string }
        data: {}
      anyOf:
        - required: [artifactId]
        - required: [data]

    Workspace:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        localPath: { type: string, nullable: true }
        status: { type: string }
        traceFile: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceManifest:
      type: object
      required: [schemaVersion, workspaceId, currentScriptId, traceFile]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        workspaceId: { type: string }
        currentScriptId: { type: string }
        currentJobId: { type: string, nullable: true }
        traceFile: { type: string }

    WorkspaceInitializeResponse:
      type: object
      required: [workspace, manifest]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        manifest:
          $ref: "#/components/schemas/WorkspaceManifest"
        storage:
          anyOf:
            - $ref: "#/components/schemas/StorageBinding"
            - type: "null"
        name: { type: string }

    WorkspaceDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workspaceId, deleted]
          properties:
            workspaceId: { type: string }
            deleted: { type: boolean, enum: [true] }

    WorkspaceDirectorySelectResponse:
      type: object
      required: [directory, cancelled, method]
      properties:
        directory: { type: string, nullable: true }
        cancelled: { type: boolean }
        method:
          type: string
          enum: [macos, windows, linux, unsupported]

    StorageBinding:
      type: object
      required: [id, workspaceId, kind, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        kind: { type: string, enum: [LOCAL, S3] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        localPath: { type: string, nullable: true }
        s3Bucket: { type: string, nullable: true }
        s3Prefix: { type: string, nullable: true }
        s3Region: { type: string, nullable: true }
        s3Endpoint: { type: string, nullable: true }

    WorkspaceStatus:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        storage:
          anyOf:
            - $ref: "#/components/schemas/StorageBinding"
            - type: "null"
        modules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModuleState"
        activeShotSet:
          anyOf:
            - $ref: "#/components/schemas/ShotSet"
            - type: "null"
        nextAction:
          type: object
          additionalProperties: true

    ShotImageRequirement:
      type: object
      additionalProperties: true
      properties:
        subject: { type: string }
        composition: { type: string }
        lighting: { type: string }
        avoid:
          type: array
          items: { type: string }

    ShotVideoRequirement:
      type: object
      additionalProperties: true
      properties:
        motion: { type: string }
        continuity: { type: string }
        durationSec: { type: integer, minimum: 4, maximum: 12 }
        avoid:
          type: array
          items: { type: string }

    ShotPromptShot:
      type: object
      required: [title, startSec, endSec, shotImage, shotVideo]
      properties:
        id: { type: string }
        title: { type: string }
        objective: { type: string }
        startSec: { type: number }
        endSec: { type: number }
        visualPrompt: { type: string }
        shotImage:
          $ref: "#/components/schemas/ShotImageRequirement"
        shotVideo:
          $ref: "#/components/schemas/ShotVideoRequirement"

    ShotSet:
      type: object
      required: [id, workspaceId, shotPromptArtifactId, status, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotPromptArtifactId: { type: string }
        status: { type: string, enum: [active, archived] }
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        shotCount:
          type: integer
          minimum: 0
          description: 该分镜链路实例包含的分镜脚本数量。
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }

    ShotRequirements:
      type: object
      required: [shotImage, shotVideo]
      properties:
        shotImage:
          $ref: "#/components/schemas/ShotImageRequirement"
        shotVideo:
          $ref: "#/components/schemas/ShotVideoRequirement"
        sourceShotPromptArtifactId: { type: string }

    Shot:
      type: object
      required: [id, workspaceId, shotSetId, orderIndex, title, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotSetId: { type: string }
        orderIndex:
          type: integer
          description: >-
            0-based workflow order derived from shot array position; not the
            provider-facing shots[].index.
        title: { type: string }
        objective: { type: string }
        defaultDurationSec: { type: integer }
        status:
          $ref: "#/components/schemas/ShotStatus"
        requirements:
          $ref: "#/components/schemas/ShotRequirements"
        selectedImage:
          anyOf:
            - $ref: "#/components/schemas/ImageSelectArtifact"
            - type: "null"
        selectedVideo:
          anyOf:
            - $ref: "#/components/schemas/VideoSelectArtifact"
            - type: "null"
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        nextAction:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShotAssetRef:
      type: object
      required: [id, shotId, assetId, role, weight, position]
      properties:
        id: { type: string }
        shotId: { type: string }
        assetId: { type: string }
        role:
          type: string
          enum:
            [
              product_identity,
              reference_style,
              reference_scene,
              first_frame_hint,
              other
            ]
        weight: { type: number, default: 1 }
        position: { type: integer, minimum: 0 }
        ref: { type: string }
        url: { type: string }
        metadata:
          type: object
          additionalProperties: true

    PatchShotAssetRefsRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            type: object
            required: [assetId, role]
            properties:
              assetId: { type: string }
              role:
                type: string
                enum:
                  [
                    product_identity,
                    reference_style,
                    reference_scene,
                    first_frame_hint,
                    other
                  ]
              weight: { type: number, minimum: 0, maximum: 1 }

    ImagePromptJson:
      type: object
      additionalProperties: true
      required:
        [
          promptText,
          negativePrompt,
          visualStyle,
          composition,
          lighting,
          productVisibilityRule,
          referenceImageUsage,
          qualityChecklist
        ]
      properties:
        promptText: { type: string }
        negativePrompt: { type: string, nullable: true }
        visualStyle: { type: string, nullable: true }
        composition: { type: string, nullable: true }
        lighting: { type: string, nullable: true }
        productVisibilityRule: { type: string }
        referenceImageUsage:
          type: array
          items:
            type: object
            required: [assetId, usage, instruction]
            properties:
              assetId: { type: string }
              usage:
                type: string
                enum:
                  [
                    product_identity,
                    style_reference,
                    scene_reference,
                    composition_reference
                  ]
              instruction: { type: string }
        qualityChecklist:
          type: array
          items: { type: string }
        context:
          type: object
          additionalProperties: true

    ImagePromptArtifact:
      type: object
      properties:
        id: { type: string }
        shotId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, APPROVED, STALE, ARCHIVED] }
        promptText: { type: string }
        negativePrompt: { type: string }
        referenceAssetIds:
          type: array
          items: { type: string }
        promptJson:
          $ref: "#/components/schemas/ImagePromptJson"
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdBy: { type: string, enum: [agent, user, system] }
        agentName: { type: string, nullable: true }
        baseArtifactId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ImagePromptRegenerateRequest:
      type: object
      required: [baseArtifactId]
      additionalProperties: false
      properties:
        baseArtifactId: { type: string }
        userDirection:
          type: string
          description: 用户对本次重新生成的补充反馈；最终 prompt 仍由后端基于 shotImage 和 shotVideo 重新装配。

    VideoScriptJson:
      type: object
      additionalProperties: true
      required:
        [
          durationSec,
          shotGoal,
          startFrameDescription,
          endFrameDescription,
          continuityWithPrevious,
          continuityWithNext,
          cameraMotion,
          subjectMotion,
          productVisibility,
          sceneConsistency,
          voiceover,
          onscreenText,
          providerPrompt,
          negativePrompt,
          riskNotes
        ]
      properties:
        durationSec: { type: number }
        shotGoal: { type: string }
        startFrameDescription: { type: string }
        endFrameDescription: { type: string }
        continuityWithPrevious: { type: string, nullable: true }
        continuityWithNext: { type: string, nullable: true }
        cameraMotion: { type: string }
        subjectMotion: { type: string }
        productVisibility: { type: string }
        sceneConsistency: { type: string }
        voiceover: { type: string, nullable: true }
        onscreenText: { type: string, nullable: true }
        providerPrompt: { type: string }
        negativePrompt: { type: string, nullable: true }
        riskNotes:
          type: array
          items: { type: string }
        context:
          type: object
          additionalProperties: true

    VideoScriptArtifact:
      type: object
      properties:
        id: { type: string }
        shotId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, APPROVED, STALE, ARCHIVED] }
        durationSec: { type: number }
        scriptJson:
          $ref: "#/components/schemas/VideoScriptJson"
        providerPrompt: { type: string }
        basedOnImageCandidateId: { type: string, nullable: true }
        basedOnPrevImageCandidateId: { type: string, nullable: true }
        basedOnNextImageCandidateId: { type: string, nullable: true }
        sourceFingerprint:
          $ref: "#/components/schemas/SourceFingerprint"
        promptAssembly:
          $ref: "#/components/schemas/PromptAssemblyMetadata"
        createdAt: { type: string, format: date-time }

    GenerationBatch:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestedCount: { type: integer }
        succeededCount: { type: integer }
        failedCount: { type: integer }
        provider: { type: string }
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        providerRequest: { type: object, additionalProperties: true }
        errorMessage: { type: string, nullable: true }

    ImageCandidate:
      type: object
      properties:
        id: { type: string }
        batchId: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        imageUrl: { type: string, nullable: true }
        objectKey: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        provider: { type: string }
        providerResponse: { type: object, additionalProperties: true }
        status:
          $ref: "#/components/schemas/CandidateStatus"
        errorMessage: { type: string, nullable: true }

    VideoCandidate:
      type: object
      properties:
        id: { type: string }
        batchId: { type: string }
        workspaceId: { type: string }
        shotId: { type: string }
        videoUrl: { type: string, nullable: true }
        objectKey: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        durationSec: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        provider: { type: string }
        providerResponse: { type: object, additionalProperties: true }
        status:
          $ref: "#/components/schemas/CandidateStatus"
        errorMessage: { type: string, nullable: true }

    ImageSelectArtifact:
      type: object
      required: [id, shotId, imageCandidateId, selectedAt]
      properties:
        id: { type: string }
        shotId: { type: string }
        imageCandidateId: { type: string }
        imageGenerationBatchId: { type: string }
        selectedBy: { type: string }
        selectedAt: { type: string, format: date-time }

    VideoSelectArtifact:
      type: object
      required: [id, shotId, videoCandidateId, selectedAt]
      properties:
        id: { type: string }
        shotId: { type: string }
        videoCandidateId: { type: string }
        videoGenerationBatchId: { type: string }
        selectedBy: { type: string }
        selectedAt: { type: string, format: date-time }

    ImageSelectionView:
      type: object
      required:
        [shotId, selectedCandidateId, selectedImageUrl, nextShotId, allShotsImageSelected]
      description: >-
        当前 shot 的已确认分镜图视图。重新生成候选图不会清空或替换该选择；
        当最新 round 的 candidates 不包含 selectedCandidateId 时，selectedImageUrl
        仍指向旧轮次已确认图片，供前端继续展示当前图。
      properties:
        shotId: { type: string }
        selectedCandidateId: { type: string }
        selectedImageUrl: { type: string }
        nextShotId: { type: string, nullable: true }
        allShotsImageSelected: { type: boolean }

    VideoSelectionView:
      type: object
      required:
        [shotId, selectedCandidateId, selectedVideoUrl, duration, allShotsVideoSelected]
      description: 当前 shot 的已确认分镜视频视图。
      properties:
        shotId: { type: string }
        selectedCandidateId: { type: string }
        selectedVideoUrl: { type: string }
        duration: { type: number }
        allShotsVideoSelected: { type: boolean }

    ImageRound:
      type: object
      properties:
        artifact:
          $ref: "#/components/schemas/ImagePromptArtifact"
        batch:
          anyOf:
            - $ref: "#/components/schemas/GenerationBatch"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ImageCandidate"
        selection:
          anyOf:
            - $ref: "#/components/schemas/ImageSelectionView"
            - type: "null"
          description: >-
            当前 shot 的已确认分镜图；可能来自旧候选轮次，不要求属于本 round.candidates。
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        context: {}

    VideoRound:
      type: object
      properties:
        artifact:
          $ref: "#/components/schemas/VideoScriptArtifact"
        batch:
          anyOf:
            - $ref: "#/components/schemas/GenerationBatch"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/VideoCandidate"
        selection:
          anyOf:
            - $ref: "#/components/schemas/VideoSelectionView"
            - type: "null"
        frames:
          type: object
          properties:
            firstFrameUrl: { type: string, nullable: true }
            lastFrameUrl: { type: string, nullable: true }
            firstFrameCandidateId: { type: string, nullable: true }
            lastFrameCandidateId: { type: string, nullable: true }
        upstream:
          $ref: "#/components/schemas/UpstreamChange"
        context: {}

    FinalVideoJob:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        shotSetId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        outputAspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        sourceVideoCandidateIds:
          type: array
          items: { type: string }
        sourceVideoScriptArtifactIds:
          type: array
          items: { type: string }
        localUrl: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        compiledManifest: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignPublication:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        finalVideoJobId: { type: string, nullable: true }
        platform: { type: string }
        channelName: { type: string }
        kolName: { type: string, nullable: true }
        publishUrl: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }

    CampaignMetric:
      type: object
      properties:
        id: { type: string }
        publicationId: { type: string }
        impressions: { type: integer }
        clicks: { type: integer }
        conversions: { type: integer }
        spendCents: { type: integer }
        ctr: { type: number }
        source: { type: string }
        metadata: { type: object, additionalProperties: true }
        capturedAt: { type: string, format: date-time }

paths:
  /api/health:
    get:
      tags: [Platform]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  runtime: { type: string, enum: [all, api, worker] }

  /api/config/limits:
    get:
      tags: [Platform]
      summary: 获取候选数量、并发和宽高比限制
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      defaultImageCandidates: { type: integer }
                      maxImageCandidatesPerShot: { type: integer }
                      defaultVideoCandidates: { type: integer }
                      maxVideoCandidatesPerShot: { type: integer }
                      generationWorkerConcurrency: { type: integer }
                      providerConcurrency:
                        type: object
                        properties:
                          text: { type: integer }
                          image: { type: integer }
                          video: { type: integer }
                      aspectRatios:
                        type: array
                        items:
                          $ref: "#/components/schemas/AspectRatio"

  /api/pipeline/contracts:
    get:
      tags: [Platform]
      summary: 获取 agent/prompt/schema 契约元数据
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/test-runs/{runId}:
    delete:
      tags: [Platform]
      summary: 测试清理专用
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: integer }
        "403":
          $ref: "#/components/responses/Error"

  /api/materials:
    post:
      tags: [Material]
      summary: 登记外部商品图
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl: { type: string }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/materials/product-image:
    post:
      tags: [Material]
      summary: 上传 base64 商品图
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, dataBase64]
              properties:
                filename: { type: string }
                contentType: { type: string }
                dataBase64: { type: string }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspaces:
    get:
      tags: [Workspace]
      summary: 列出可见工作区（DB 已登记 + 磁盘发现的未登记草稿）
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    description: >-
                      DB 已登记且有有效本地路径的工作区（含 active storage binding）。
                      配置 WORKSPACE_DISCOVERY_ROOTS 时，仅展示这些 roots 下的 workspace。
                    items:
                      $ref: "#/components/schemas/Workspace"
                  discovered:
                    type: array
                    description: >-
                      WORKSPACE_DISCOVERY_ROOTS 下扫描到的、磁盘存在 .daireel/workspace.json
                      但 DB 无对应行的工作区（已按路径去重剔除已登记项）。点击经 init 重新打开会复用其原始 workspaceId。
                    items:
                      type: object
                      properties:
                        localPath: { type: string }
                        workspaceId:
                          type: string
                          nullable: true
                      required: [localPath]
    post:
      tags: [Workspace]
      summary: 创建逻辑工作区
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInitializeResponse"

  /api/workspaces/directory/select:
    post:
      tags: [Workspace]
      summary: 打开本机目录选择器
      description: >-
        由桌面/本地开发环境使用。返回用户选择的本地 workspace 目录；
        不创建 workspace，不写 storage binding。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Selected directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDirectorySelectResponse"

  /api/workspaces/init:
    post:
      tags: [Workspace]
      summary: 按本地目录初始化工作区
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directory]
              properties:
                directory: { type: string }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInitializeResponse"

  /api/workspaces/{workspaceId}:
    delete:
      tags: [Workspace]
      summary: 删除已登记工作区
      description: >-
        同步 MVP：仅删除 DB 已登记 workspace。LOCAL storage 会删除工作目录下的
        .daireel/ 创作状态目录并清理该 workspace 的业务记录；不会删除工作目录中的其他文件。
        .daireel/ 已不存在时仍视为成功。当前 active storage 为 S3 时返回
        S3_WORKSPACE_DELETE_NOT_IMPLEMENTED，不清理 DB；存在 PENDING/RUNNING 生成或成片任务时返回
        WORKSPACE_DELETE_BUSY。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeleteResponse"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/status:
    get:
      tags: [Workspace]
      summary: 获取工作区状态、artifact 摘要和 active shot set
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"

  /api/workspaces/{workspaceId}/storage:
    get:
      tags: [Workspace]
      summary: 获取存储绑定
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Storage binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/StorageBinding"
                      - type: "null"

  /api/workspaces/{workspaceId}/storage/bind:
    post:
      tags: [Workspace]
      summary: 绑定 LOCAL 或 S3 storage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, localPath]
                  properties:
                    kind: { type: string, enum: [local] }
                    localPath: { type: string }
                - type: object
                  required: [kind, bucket, prefix]
                  properties:
                    kind: { type: string, enum: [s3] }
                    bucket: { type: string }
                    prefix: { type: string }
                    region: { type: string }
                    endpoint: { type: string }
      responses:
        "200":
          description: Storage binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StorageBinding"
        "409":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/materials:
    post:
      tags: [Material]
      summary: 上传工作区素材
      description: image/* 文件超过 10MB 返回 400 IMAGE_TOO_LARGE_FOR_MODEL；非图片仍使用通用 50MB 上限。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, dataBase64]
              properties:
                filename: { type: string }
                contentType: { type: string }
                dataBase64: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded asset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/prompt-requirements:
    get:
      tags: [ModuleArtifacts]
      summary: 获取 prompt requirements 状态
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Requirements state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ModuleState"

  /api/workspaces/{workspaceId}/prompt-requirements/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 提交待审 prompt requirements
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/PromptRequirementData"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/prompt-requirements/approve:
    post:
      tags: [ModuleArtifacts]
      summary: 批准 prompt requirements 为 current
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/reference-video/import:
    post:
      tags: [ModuleArtifacts]
      summary: 从参考视频导入 prompt requirements 草稿
      description: >
        只生成 requirements draft 并返回给前端填表；不会创建 prompt_requirements_artifacts、
        不会 approve requirements，也不会把参考视频登记到素材库。仅当 workspace 尚无
        current approved prompt requirements 时可调用。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceVideoImportRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Reference video requirements draft
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ReferenceVideoImportResult"
        "400":
          description: Unsupported URL/file, non-direct video URL, unsafe URL, or size/type violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Current approved prompt requirements already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/workspaces/{workspaceId}/material-intake:
    get:
      tags: [ModuleArtifacts]
      summary: 获取 material-intake 模块状态
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Module state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ModuleState"

  /api/workspaces/{workspaceId}/material-intake/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 运行物料解读 agent，生成 proposed artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/material-intake/approve:
    post:
      tags: [ModuleArtifacts]
      summary: 批准 material-intake artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/product-brief:
    get:
      tags: [ModuleArtifacts]
      summary: 获取 product-brief 模块状态
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Module state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ModuleState"

  /api/workspaces/{workspaceId}/product-brief/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 运行商品卖点 agent，生成 proposed artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBriefProposeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/product-brief/approve:
    post:
      tags: [ModuleArtifacts]
      summary: 批准 product-brief artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/storyboard:
    get:
      tags: [ModuleArtifacts]
      summary: 获取 storyboard 模块状态
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Module state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ModuleState"

  /api/workspaces/{workspaceId}/storyboard/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 运行故事板 agent，生成 proposed artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/storyboard/voiceover/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 按当前三镜比例重写分镜口播，生成 proposed storyboard artifact
      description: 读取当前 approved prompt requirements、material intake、product brief，以及请求中的 15 秒三镜 storyboard draft；只重写 shots[].voiceover。请求完成前前端应保留原 draft，不显示本地压缩草稿；返回后由用户显式 approve 生效。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryboardVoiceoverProposeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/storyboard/approve:
    post:
      tags: [ModuleArtifacts]
      summary: 批准 storyboard artifact
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"

  /api/workspaces/{workspaceId}/shotprompt:
    get:
      tags: [ModuleArtifacts]
      summary: 获取 shotprompt 模块状态
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Module state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ModuleState"

  /api/workspaces/{workspaceId}/shotprompt/propose:
    post:
      tags: [ModuleArtifacts]
      summary: 运行分镜 prompt agent，生成 proposed artifact
      description: current approved storyboard 必须是 P0 15 秒三镜脚本；输出 shots 的数量、顺序和 index 必须与 current approved storyboard.shots 完全一致，每个 shot 包含 shotImage 与 shotVideo dict。非 P0 上游返回 400 UPSTREAM_STORYBOARD_NOT_P0。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shotprompt/approve:
    post:
      tags: [ModuleArtifacts]
      summary: 批准 shotprompt artifact
      description: current approved storyboard 必须是 P0 15 秒三镜脚本；只更新 approved/current 指针，不创建或重建 shots。非 P0 上游返回 400 UPSTREAM_STORYBOARD_NOT_P0。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModuleArtifactEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shot-sets:
    get:
      tags: [ShotSet]
      summary: 列出 shot sets
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Shot sets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShotSet"
    post:
      tags: [ShotSet]
      summary: 将当前 approved shotprompt apply 为新的 active shot set
      description: current approved storyboard 必须是 P0 15 秒三镜脚本，且 approved shotprompt 必须与该 storyboard 的 shots 数量、顺序和 index 完全一致；非 P0 上游返回 400 UPSTREAM_STORYBOARD_NOT_P0。
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shotPromptArtifactId: { type: string }
      responses:
        "200":
          description: Created active shot set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShotSet"
        "400":
          $ref: "#/components/responses/Error"

  /api/workspaces/{workspaceId}/shot-sets/{shotSetId}/shots:
    get:
      tags: [ShotSet, Shot]
      summary: 获取指定 shot set 下的 shots
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ShotSetId"
      responses:
        "200":
