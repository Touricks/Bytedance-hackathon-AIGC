        - version
        - status
        - promptText
        - referenceAssetIds
        - createdBy
        - createdAt
      properties:
        id:
          type: string
        shotId:
          type: string
        version:
          type: integer
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - APPROVED
            - STALE
            - ARCHIVED
        promptText:
          type: string
        negativePrompt:
          type:
            - string
            - "null"
        referenceAssetIds:
          type: array
          items:
            type: string
        promptJson:
          type: object
          additionalProperties: true
        createdBy:
          type: string
        createdAt:
          type: string

    ProposeImagePromptRequest:
      type: object
      properties:
        referenceAssetIds:
          type: array
          default: []
          items:
            type: string
        userHint:
          type: string
        stylePresetId:
          type: string

    PatchImagePromptRequest:
      type: object
      required:
        - promptText
      properties:
        promptText:
          type: string
          minLength: 1
        negativePrompt:
          type: string
        referenceAssetIds:
          type: array
          default: []
          items:
            type: string

    CreateImageBatchRequest:
      type: object
