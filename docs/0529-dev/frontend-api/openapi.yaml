        requestedCount:
          type: integer
        succeededCount:
          type: integer
        failedCount:
          type: integer
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ImageCandidate"
      additionalProperties: true

    ImageCandidate:
      type: object
      required:
