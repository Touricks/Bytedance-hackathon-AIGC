        - PARTIAL
        - FAILED
        - CANCELLED

    CandidateStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - SUCCEEDED
        - FAILED
        - REJECTED

    ImageBatchDetail:
      type: object
      required:
