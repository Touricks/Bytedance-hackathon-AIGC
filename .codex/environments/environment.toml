# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Bytedancehack"

[setup]
script = '''
set -Eeuo pipefail

SOURCE_ROOT="${CODEX_PROJECT_PATH:-$(pwd -P)}"
WORKTREE_ROOT="${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is not set}"

echo "Source:   $SOURCE_ROOT"
echo "Worktree: $WORKTREE_ROOT"

cd "$WORKTREE_ROOT"

# Copy local env files from the original project root.
copied_env=0
for env_file in "$SOURCE_ROOT"/.env "$SOURCE_ROOT"/.env.local "$SOURCE_ROOT"/.env.*.local; do
  [ -f "$env_file" ] || continue
  cp -p "$env_file" "$WORKTREE_ROOT/$(basename "$env_file")"
  copied_env=1
  echo "Copied $(basename "$env_file")"
done

# Fallback: if no private env exists, create one from the tracked example.
if [ "$copied_env" -eq 0 ] && [ ! -f "$WORKTREE_ROOT/.env" ] && [ -f "$WORKTREE_ROOT/.env.example" ]; then
  cp "$WORKTREE_ROOT/.env.example" "$WORKTREE_ROOT/.env"
  echo "Created .env from .env.example"
fi

# Local ignored runtime dirs used by this repo.
mkdir -p "$WORKTREE_ROOT/storage/uploads" "$WORKTREE_ROOT/storage/trace"

# This repo is a pnpm workspace.
if command -v corepack >/dev/null 2>&1; then
  corepack enable
  corepack prepare pnpm@9.15.4 --activate
fi

pnpm install --frozen-lockfile

echo "Worktree setup complete."
'''
